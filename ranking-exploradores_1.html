<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Top 10 Exploradores</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:10px;background:transparent;font-family:system-ui,'Segoe UI',sans-serif}
.rk{max-width:1000px;margin:0 auto;background:#fff;border-radius:22px;border-top:7px solid #3498db;box-shadow:0 6px 24px rgba(0,0,0,.1);padding:20px 22px 24px}
.rk h2{margin:0;text-align:center;color:#2c3e50;font-size:1.6rem}
.rk h2 i{color:#3498db;font-style:normal;font-size:.8em;margin-right:8px}
.rk p{text-align:center;color:#8a97a3;margin:4px 0 18px;font-size:.95rem}
.lista{display:grid;grid-auto-flow:column;grid-template-rows:repeat(5,auto);gap:12px 18px}
.fila{display:flex;align-items:center;gap:12px;padding:10px 16px;border:1.5px solid #e5e9f0;background:#f8fafc;border-radius:14px;min-width:0}
.pos{width:28px;text-align:center;font-weight:800;color:#5d6d7e}
.av{width:46px;height:46px;border-radius:50%;background:#fff;border:2px solid #e5e9f0;overflow:hidden;flex:none}
.av svg{width:100%;height:100%;display:block}
.nom{flex:1;font-weight:800;color:#2c3e50;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pts{font-weight:900;color:#f39c12;font-size:1.1rem;display:flex;align-items:center;gap:6px}
.m1{background:#fffdf0;border-color:#f1c40f}.m2{border-color:#aeb6bf}.m3{background:#fff8f3;border-color:#e67e22}
.yo{background:#eefcf3;border-color:#2ecc71}.yo .nom{color:#1e9d55}
@media(max-width:640px){.lista{grid-auto-flow:row;grid-template-rows:none}}
</style>
</head>
<body>
<section class="rk">
  <h2><i>◆</i>Top 10 Exploradores</h2>
  <p>Tabla general de clasificación de la liga inicial</p>
  <div class="lista" id="lista"></div>
</section>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <g id="ojos"><circle cx="38" cy="48" r="5.5" fill="#222"/><circle cx="62" cy="48" r="5.5" fill="#222"/><circle cx="40" cy="46" r="1.8" fill="#fff"/><circle cx="64" cy="46" r="1.8" fill="#fff"/></g>
      <ellipse id="nariz" cx="50" cy="60" rx="6" ry="4.5" fill="#222"/>
      <path id="boca" d="M42 68q8 7 16 0" stroke="#222" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    </defs>
  </svg>
<script>
const AV={"rana": "<svg viewBox=\"0 0 100 100\"><rect width=\"100\" height=\"100\" fill=\"#1e8449\"/><circle cx=\"30\" cy=\"34\" r=\"14\" fill=\"#8fe36b\"/><circle cx=\"70\" cy=\"34\" r=\"14\" fill=\"#8fe36b\"/><ellipse cx=\"50\" cy=\"60\" rx=\"38\" ry=\"28\" fill=\"#8fe36b\"/><circle cx=\"30\" cy=\"34\" r=\"8\" fill=\"#fff\"/><circle cx=\"70\" cy=\"34\" r=\"8\" fill=\"#fff\"/><circle cx=\"31\" cy=\"35\" r=\"4\" fill=\"#222\"/><circle cx=\"69\" cy=\"35\" r=\"4\" fill=\"#222\"/><path d=\"M22 64q28 22 56 0\" stroke=\"#1e6b3a\" stroke-width=\"3\" fill=\"none\" stroke-linecap=\"round\"/><circle cx=\"44\" cy=\"54\" r=\"2\" fill=\"#1e6b3a\"/><circle cx=\"56\" cy=\"54\" r=\"2\" fill=\"#1e6b3a\"/></svg>", "gato": "<svg viewBox=\"0 0 100 100\"><rect width=\"100\" height=\"100\" fill=\"#95a5a6\"/><path d=\"M18 10l26 20-26 22zM82 10L56 30l26 22z\" fill=\"#3d3d3d\"/><circle cx=\"50\" cy=\"56\" r=\"34\" fill=\"#4a4a4a\"/><ellipse cx=\"38\" cy=\"50\" rx=\"7\" ry=\"8\" fill=\"#b6e36b\"/><ellipse cx=\"62\" cy=\"50\" rx=\"7\" ry=\"8\" fill=\"#b6e36b\"/><ellipse cx=\"38\" cy=\"50\" rx=\"2\" ry=\"7\" fill=\"#111\"/><ellipse cx=\"62\" cy=\"50\" rx=\"2\" ry=\"7\" fill=\"#111\"/><path d=\"M45 62h10l-5 6z\" fill=\"#ff8fab\"/><path d=\"M8 58l22 4M8 68l22-2M92 58l-22 4M92 68l-22-2\" stroke=\"#ddd\" stroke-width=\"1.8\"/></svg>", "koala": "<svg viewBox=\"0 0 100 100\"><rect width=\"100\" height=\"100\" fill=\"#d5dbdb\"/><circle cx=\"20\" cy=\"38\" r=\"17\" fill=\"#7f8c8d\"/><circle cx=\"80\" cy=\"38\" r=\"17\" fill=\"#7f8c8d\"/><circle cx=\"20\" cy=\"38\" r=\"9\" fill=\"#ecf0f1\"/><circle cx=\"80\" cy=\"38\" r=\"9\" fill=\"#ecf0f1\"/><ellipse cx=\"50\" cy=\"56\" rx=\"32\" ry=\"32\" fill=\"#95a5a6\"/><use href=\"#ojos\" y=\"-2\"/><ellipse cx=\"50\" cy=\"60\" rx=\"9\" ry=\"13\" fill=\"#222\"/></svg>", "pinguino": "<svg viewBox=\"0 0 100 100\"><rect width=\"100\" height=\"100\" fill=\"#1b2a49\"/><ellipse cx=\"50\" cy=\"56\" rx=\"32\" ry=\"38\" fill=\"#111\"/><ellipse cx=\"50\" cy=\"64\" rx=\"22\" ry=\"28\" fill=\"#fff\"/><ellipse cx=\"24\" cy=\"54\" rx=\"5\" ry=\"9\" fill=\"#f7c948\"/><ellipse cx=\"76\" cy=\"54\" rx=\"5\" ry=\"9\" fill=\"#f7c948\"/><circle cx=\"40\" cy=\"40\" r=\"7\" fill=\"#fff\"/><circle cx=\"60\" cy=\"40\" r=\"7\" fill=\"#fff\"/><circle cx=\"41\" cy=\"41\" r=\"3.5\" fill=\"#111\"/><circle cx=\"59\" cy=\"41\" r=\"3.5\" fill=\"#111\"/><path d=\"M42 50h16l-8 11z\" fill=\"#f39c12\"/></svg>", "oso": "<svg viewBox=\"0 0 100 100\"><rect width=\"100\" height=\"100\" fill=\"#a0662b\"/><circle cx=\"24\" cy=\"24\" r=\"12\" fill=\"#4a2c12\"/><circle cx=\"76\" cy=\"24\" r=\"12\" fill=\"#4a2c12\"/><circle cx=\"50\" cy=\"54\" r=\"34\" fill=\"#6b3f1d\"/><ellipse cx=\"50\" cy=\"66\" rx=\"16\" ry=\"12\" fill=\"#d9b38c\"/><use href=\"#ojos\"/><use href=\"#nariz\" y=\"2\"/></svg>", "zorro": "<svg viewBox=\"0 0 100 100\"><rect width=\"100\" height=\"100\" fill=\"#f39c12\"/><path d=\"M16 12l26 24-22 24zM84 12L58 36l22 24z\" fill=\"#c0392b\"/><path d=\"M12 40Q50 20 88 40Q82 86 50 92Q18 86 12 40z\" fill=\"#e8742a\"/><path d=\"M50 62L14 52Q22 86 50 92Q78 86 86 52z\" fill=\"#fff\"/><use href=\"#ojos\"/><use href=\"#nariz\" y=\"8\"/></svg>", "buho": "<svg viewBox=\"0 0 100 100\"><rect width=\"100\" height=\"100\" fill=\"#1f3a6e\"/><path d=\"M22 14l16 20H18zM78 14L62 34h20z\" fill=\"#7a5a3a\"/><ellipse cx=\"50\" cy=\"56\" rx=\"34\" ry=\"36\" fill=\"#8b6b4a\"/><circle cx=\"36\" cy=\"46\" r=\"14\" fill=\"#fff\"/><circle cx=\"64\" cy=\"46\" r=\"14\" fill=\"#fff\"/><circle cx=\"36\" cy=\"46\" r=\"6\" fill=\"#222\"/><circle cx=\"64\" cy=\"46\" r=\"6\" fill=\"#222\"/><path d=\"M44 58h12l-6 12z\" fill=\"#f5a623\"/><path d=\"M34 76q16 12 32 0\" stroke=\"#d9c2a0\" stroke-width=\"4\" fill=\"none\"/></svg>"};
const BOTS=[['FichaVeloz',150,'rana'],['DadoSuertudo',135,'gato'],['PrimerPaso',110,'koala'],['LudoPanda',95,'pinguino'],['MonopolyKid',85,'oso'],['FichaRoja',75,'zorro'],['DadoLoco',60,'buho'],['NovatoPro',45,'gato'],['EstrategaLudo',20,'koala']];
const GEN='<svg viewBox="0 0 100 100"><rect width="100" height="100" fill="#f7d02c"/><circle cx="50" cy="40" r="16" fill="#fff"/><path d="M18 96q32-48 64 0z" fill="#fff"/></svg>';
const LEAF='<svg width="18" height="18" viewBox="0 0 24 24"><path d="M5 19C5 9 11 4 20 4c0 9-5 15-15 15z" fill="#2ecc71"/><path d="M5 19L14 10" stroke="#fff" stroke-width="1.6"/></svg>';
const leer=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
function pintar(){
  const ok=leer('ranking_guardado')==='1',nombre=leer('ranking_nombre')||'';
  let svg=ok?leer('ranking_avatar_svg'):null;
  if(!svg||svg.indexOf('<svg')!==0||/<script|\son\w+=/i.test(svg))svg=GEN;
  const yo={n:ok&&nombre?nombre+' (Tú)':'Tú (Sin Apodo)',v:parseInt(leer('ranking_exploradores_hojas'))||0,svg:svg,yo:1};
  const L=BOTS.map(b=>({n:b[0],v:b[1],svg:AV[b[2]]})).concat(yo).sort((a,b)=>b.v-a.v||(a.yo?1:b.yo?-1:0));
  const c=document.getElementById('lista');c.innerHTML='';
  L.forEach((j,i)=>{
    const f=document.createElement('div');
    f.className='fila'+(i<3?' m'+(i+1):'')+(j.yo?' yo':'');
    f.innerHTML='<span class="pos">'+(i<3?['🥇','🥈','🥉'][i]:i+1)+'</span><span class="av">'+j.svg+'</span><span class="nom"></span><span class="pts"><b></b>'+LEAF+'</span>';
    f.querySelector('.nom').textContent=j.n;f.querySelector('b').textContent=j.v;
    c.appendChild(f);
  });
}
pintar();
window.addEventListener('storage',pintar);
setInterval(pintar,800);
</script>
</body>
</html>
