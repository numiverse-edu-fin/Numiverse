<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Comparación 1 Numiverse</title>
<style>
body{font-family:'Segoe UI',sans-serif;background:transparent;text-align:center;padding:10px;margin:0;user-select:none}
.game-box{max-width:460px;margin:0 auto;background:linear-gradient(135deg,#fffdf2,#f3faf6);padding:20px;border-radius:20px;border:2px solid #207168;box-shadow:0 4px 15px rgba(32,113,104,.08);position:relative;overflow:hidden;min-height:440px;display:flex;flex-direction:column;justify-content:space-between}
.ins{display:flex;align-items:center;gap:8px;background:#207168;color:#fff;padding:10px;border-radius:10px;margin-bottom:10px}
.ins p{font-size:15px;font-weight:bold;text-align:left;flex:1;margin:0}
.aud{background:#d4af37;border:0;border-radius:50%;width:34px;height:34px;font-size:16px;cursor:pointer;flex-shrink:0;color:#fff;box-shadow:0 2px 4px rgba(0,0,0,.15)}
.dots{display:flex;justify-content:center;align-items:center;gap:8px;margin-bottom:8px;font-size:12px;font-weight:bold;color:#207168}
.dots i{width:12px;height:12px;border-radius:50%;background:#dfeee7;border:2px solid #207168;display:inline-block}
.dots i.now{background:#d4af37;border-color:#b8860b}.dots i.done{background:#207168}
.et{font-size:11px;font-weight:bold;color:#207168;margin:6px 0 4px}
.zona{background:#fff;border:2px dashed #207168;border-radius:12px;padding:10px}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes pulso{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
.calle{display:flex;gap:8px}
.casa{flex:1;min-height:92px;border:3px dashed #d4af37;border-radius:12px;background:#fff;display:flex;align-items:center;justify-content:center;position:relative;padding-top:16px;transition:background .15s;cursor:pointer}
.casa::before{content:'🏠';position:absolute;top:1px;left:50%;transform:translateX(-50%);font-size:18px}
.casa.over{background:#eaf6ef;border-color:#207168}
.eje{display:flex;justify-content:space-between;font-size:11px;font-weight:bold;color:#207168;margin:6px 4px 0}
.pile{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;background:#fff;border:2px dashed #207168;border-radius:12px;padding:10px;min-height:66px;align-items:center}
.vacio{color:#9fb3af;font-size:13px;font-weight:bold}
.caja{width:60px;height:54px;border-radius:10px;background:linear-gradient(145deg,#e0b070,#b88445);color:#fff;font-weight:800;font-size:22px;border:0;cursor:grab;touch-action:none;box-shadow:0 2px 4px rgba(0,0,0,.2);font-family:inherit}
.caja.sel{outline:4px solid #f2c94c;transform:scale(1.08)}
.ghost{position:fixed;z-index:1000;width:60px;height:54px;line-height:54px;text-align:center;font-size:22px;font-weight:800;color:#fff;background:linear-gradient(145deg,#e0b070,#b88445);border-radius:10px;pointer-events:none;transform:translate(-50%,-60%);filter:drop-shadow(0 4px 6px rgba(0,0,0,.25));display:none}
.bal{position:relative;height:200px}
.beam{display:flex;justify-content:space-between;gap:16px;padding:0 4px;transition:transform .6s;transform-origin:50% 50%;position:absolute;left:0;right:0;top:20px}
.pan{flex:1;max-width:180px;height:112px;border:3px solid #d4af37;background:#fffcf2;border-radius:16px;font-size:44px;font-weight:800;color:#207168;cursor:pointer;font-family:inherit;line-height:1.1}
.pan .cj{font-size:30px}
.pan.ok{background:#d8f3e4;border-color:#1c8f5a}.pan.no{animation:shake .4s}.pan.ayuda{animation:pulso .9s infinite;border-color:#b8860b;box-shadow:0 0 12px #f2c94c}
.fulc{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:0;height:0;border-left:30px solid transparent;border-right:30px solid transparent;border-bottom:70px solid #b07a3c}
.res{font-size:13px;font-weight:bold;color:#207168;min-height:18px;margin-top:6px}
.controls{display:flex;gap:10px;margin-top:8px}
.btn{padding:12px 20px;font-size:14px;font-weight:bold;border:0;border-radius:10px;cursor:pointer;text-transform:uppercase;flex:1}
.btn-v{background:#d4af37;color:#fff}.btn-c{background:#b3c2bf;color:#207168}
.fb{font-size:15px;font-weight:bold;margin-top:8px;color:#b9650a;min-height:44px;line-height:1.35}
.vic{display:none;position:absolute;top:0;left:0;width:100%;height:100%;background:#fffdf2;align-items:center;justify-content:center;flex-direction:column;animation:cel .5s ease-out forwards;z-index:10}
.vt{font-size:32px;color:#27ae60;font-weight:900;margin:10px}.va{font-size:36px;color:#e6b800;font-weight:900;text-shadow:1px 1px 0 #fff}.vn{font-size:15px;color:#207168;font-weight:bold;margin-top:8px;padding:0 16px}
@keyframes cel{0%{transform:scale(.5);opacity:0}100%{transform:scale(1);opacity:1}}
</style>
</head>
<body>
<div class="game-box">
<div class="vic" id="vic"><div class="vt">¡LO LOGRASTE! 🎉</div><div class="va">+15 LUMIS</div><div class="vn">¡Ya sabes ordenar números!</div></div>
<div>
<div class="ins"><button class="aud" onclick="speakText()">🔊</button><p id="question-text">Reparte las cajas en las casas, del número más pequeño al más grande.</p></div>
<div class="dots" id="dots"></div>
<div class="et">LA CALLE DE ENTREGAS</div><div class="zona"><div class="calle" id="calle"></div><div class="eje"><span>MENOR</span><span>➜</span><span>MAYOR</span></div></div><div class="et">CAJAS POR REPARTIR</div><div class="pile" id="pile"></div><div class="res" id="res"></div><div class="controls"><button class="btn btn-c" onclick="borrar()">Borrar</button><button class="btn btn-v" onclick="listo()">Listo</button></div>
</div>
<div><div class="fb" id="msg"></div></div>
</div>
<script>
// MENSAJES FIJOS (para grabarlos con una voz real) y direcciones de audio: pega cada enlace en MP3.

const RONDAS=[[7,19,12,15],[42,24,38,31],[85,58,91,76]];
const TEXTOS={faltan:"Todavía hay casas sin caja. Reparte todas las cajas.",ocupada:"Esa casa ya tiene una caja. Prueba con otra casa.",p1:"Mmm, casi... Recuerda que la calle va del número más pequeño al más grande. ¿Cuál es el más pequeño?",p2:"Hagamos una prueba. Mira primero la cifra de la izquierda: el número con menos decenas va primero. Piénsalo y vuelve a intentar.",p3:"Te ayudo a ordenarlos, del más pequeño al más grande. ¡Mira cómo queda la calle!",bien:"¡Muy bien! La calle quedó en orden.",exito:"¡Lo lograste! Ganaste quince Lumis."};
const MP3={faltan:"",ocupada:"",p1:"",p2:"",p3:"",bien:"",exito:""};
let slots=[],sel=null;
function QTXT(){return 'Reparte las cajas en las casas, del número más pequeño al más grande.'}
function iniciar(){tries=0;bloq=false;slots=[null,null,null,null];sel=null;$('msg').innerText='';$('res').innerText='';dots();$('question-text').innerText=QTXT();render();setTimeout(speakText,500)}
function pila(){return RONDAS[ronda].filter(n=>slots.indexOf(n)<0)}
function render(){const c=$('calle');c.innerHTML='';
slots.forEach((n,i)=>{const d=document.createElement('div');d.className='casa';d.dataset.i=i;
if(n!==null){const b=document.createElement('button');b.className='caja';b.textContent=n;b.onclick=e=>{e.stopPropagation();if(bloq||fin)return;slots[i]=null;render()};d.appendChild(b)}
d.onclick=()=>{if(sel!==null&&!bloq)poner(i,sel)};c.appendChild(d)});
const p=$('pile');p.innerHTML='';const l=pila();
l.forEach(n=>{const b=document.createElement('button');b.className='caja'+(sel===n?' sel':'');b.textContent=n;conectar(b,n);p.appendChild(b)});
if(!l.length)p.innerHTML='<span class="vacio">¡Ya repartiste todas las cajas!</span>'}
function poner(i,n){if(slots[i]!==null){msg('ocupada');return}slots[i]=n;sel=null;render()}
function conectar(btn,n){btn.addEventListener('pointerdown',e=>{if(bloq||fin)return;e.preventDefault();const sx=e.clientX,sy=e.clientY;let mv=false;
const g=document.createElement('div');g.className='ghost';g.textContent=n;document.body.appendChild(g);
const cs=ev=>{const el=document.elementFromPoint(ev.clientX,ev.clientY);return el?el.closest('.casa'):null};
const mover=ev=>{if(!mv&&Math.hypot(ev.clientX-sx,ev.clientY-sy)>8){mv=true;g.style.display='block'}
if(mv){g.style.left=ev.clientX+'px';g.style.top=ev.clientY+'px';document.querySelectorAll('.casa').forEach(x=>x.classList.remove('over'));const c=cs(ev);if(c)c.classList.add('over')}};
const up=ev=>{window.removeEventListener('pointermove',mover);window.removeEventListener('pointerup',up);window.removeEventListener('pointercancel',up);g.remove();
document.querySelectorAll('.casa').forEach(x=>x.classList.remove('over'));if(ev.type==='pointercancel')return;
if(mv){const c=cs(ev);if(c)poner(+c.dataset.i,n)}else{sel=(sel===n?null:n);render()}};
window.addEventListener('pointermove',mover);window.addEventListener('pointerup',up);window.addEventListener('pointercancel',up)})}
function borrar(){if(bloq||fin)return;slots=[null,null,null,null];sel=null;$('msg').innerText='';render()}
function listo(){if(bloq||fin)return;if(slots.indexOf(null)>=0){msg('faltan');return}
const ok=slots.every((n,i)=>i===0||slots[i-1]<n);
if(ok){bloq=true;msg('bien');pasar(3000);return}
if(fallo(null)){bloq=true;slots=RONDAS[ronda].slice().sort((a,b)=>a-b);sel=null;render();msg('p3');pasar(4500)}}


const $=id=>document.getElementById(id);
const U=['cero','uno','dos','tres','cuatro','cinco','seis','siete','ocho','nueve','diez','once','doce','trece','catorce','quince','dieciséis','diecisiete','dieciocho','diecinueve','veinte','veintiuno','veintidós','veintitrés','veinticuatro','veinticinco','veintiséis','veintisiete','veintiocho','veintinueve'];
const D=['','','','treinta','cuarenta','cincuenta','sesenta','setenta','ochenta','noventa'];
function palabras(n){if(n<30)return U[n];const d=Math.floor(n/10),u=n%10;return D[d]+(u?' y '+U[u]:'')}
let ronda=0,tries=0,bloq=false,fin=false,voz=null,audio=null;
function elegirVoz(){if(!('speechSynthesis' in window))return;const vs=speechSynthesis.getVoices().filter(v=>v.lang.toLowerCase().indexOf('es')===0);if(!vs.length)return;
const pt=v=>{const n=v.name.toLowerCase(),l=v.lang.toLowerCase();let s=0;if(/natural|online/.test(n))s+=6;if(/google/.test(n))s+=4;
if(/paulina|monica|mónica|sabina|dalia|elvira|helena|lucia|lucía|paloma|luciana|camila|salome|salomé|valentina|sofia|sofía|marisol/.test(n))s+=3;
if(/es-pe|es-mx|es-us|es-419|es-co|es-ar/.test(l))s+=2;if(/jorge|diego|pablo|raul|raúl/.test(n))s-=1;return s};
voz=vs.sort((a,b)=>pt(b)-pt(a))[0]}
if('speechSynthesis' in window){elegirVoz();speechSynthesis.onvoiceschanged=elegirVoz}
function hablar(k){if(audio){audio.pause();audio=null}if(MP3[k]){audio=new Audio(MP3[k]);audio.play().catch(()=>leer(TEXTOS[k]));return}leer(TEXTOS[k])}
function leer(t){if(!('speechSynthesis' in window))return;speechSynthesis.cancel();
const fr=t.replace(/[^\u0020-\u007E\u00A1-\u00FF]/g,' ').replace(/([.!?])\s+/g,'$1|').split('|');
fr.forEach(f=>{if(!f.trim())return;const u=new SpeechSynthesisUtterance(f.trim());u.lang=voz?voz.lang:'es-MX';if(voz)u.voice=voz;u.rate=.88;
u.pitch=f.indexOf('¡')>=0?1.25:(f.indexOf('¿')>=0?1.18:1.08);speechSynthesis.speak(u)})}
function speakText(){leer(QTXT())}
function msg(k){$('msg').innerText=TEXTOS[k];hablar(k)}
function dots(){let h='';for(let i=0;i<RONDAS.length;i++)h+='<i class="'+(i<ronda?'done':(i===ronda?'now':''))+'"></i>';$('dots').innerHTML=h+'<span>Ronda '+Math.min(ronda+1,RONDAS.length)+' de '+RONDAS.length+'</span>'}
function fallo(b){tries++;if(b){b.classList.add('no');setTimeout(()=>b.classList.remove('no'),600)}if(tries===1)msg('p1');else if(tries===2)msg('p2');return tries>=3}
function pasar(ms){setTimeout(()=>{ronda++;if(ronda>=RONDAS.length)ganar();else iniciar()},ms)}
function ganar(){fin=true;dots();$('vic').style.display='flex';hablar('exito');try{if(!localStorage.getItem(CLAVE)){localStorage.setItem(CLAVE,'1');let w=parseInt(localStorage.getItem('savedLumis'))||0;localStorage.setItem('savedLumis',w+15)}}catch(e){}}
function mezclar(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function svgRab(n){return '<svg viewBox="0 0 80 100"><path d="M40 34C30 18 20 14 14 6c14 0 24 6 26 22C42 14 52 8 66 8c-4 8-14 14-26 26z" fill="#3E9B4F"/><circle cx="40" cy="66" r="30" fill="#D93B4A"/><ellipse cx="28" cy="54" rx="6" ry="9" fill="#fff" opacity=".25"/><text x="40" y="77" text-anchor="middle" font-size="28" font-weight="800" fill="#fff" font-family="Segoe UI,Arial,sans-serif">'+n+'</text></svg>'}

const CLAVE='ganado_comparacion1';
let yaHecho=false;
try{yaHecho=!!localStorage.getItem(CLAVE)}catch(e){}
if(yaHecho){fin=true;ronda=RONDAS.length;dots();$('vic').style.display='flex'}else{iniciar()}
</script>
</body>
</html>
