<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cobrar mis aciertos</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:transparent;font-family:'Segoe UI',system-ui,sans-serif;user-select:none;overflow:hidden}
body{padding:4px}
.w{max-width:560px;margin:0 auto}
.c{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:8px 10px;border:2px solid #207168;border-radius:12px;background:linear-gradient(135deg,#fffdf0,#f3faf6)}
.ic{flex:0 0 44px;width:44px}
.ic svg{display:block;width:100%;height:auto;filter:drop-shadow(0 1px 2px rgba(0,0,0,.25))}
.tx{flex:1 1 140px;min-width:0;text-align:left}
.t{font-weight:800;font-size:13px;color:#207168}
.fl{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.n{font-size:30px;font-weight:900;color:#207168;line-height:1.1}
.s{font-size:11px;font-weight:700;color:#7a8a86}
.g{flex:1 1 170px;padding:11px;border:0;border-radius:12px;background:#207168;color:#fff;font-size:14px;font-weight:800;font-family:inherit;cursor:pointer;box-shadow:0 3px 0 #16524a}
.g:disabled{background:#cfd8dc;box-shadow:none;cursor:default}
#m{min-height:16px;margin-top:6px;text-align:center;font-size:12px;font-weight:800;color:#1c8f5a}
</style>
</head>
<body>
<div class="w">
  <div class="c">
    <div class="ic"><svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="18.5" fill="#1f6d2a" stroke="#e8c25a" stroke-width="2.2"/><circle cx="20" cy="20" r="15.3" fill="none" stroke="rgba(255,255,255,.35)" stroke-width=".8"/><path d="M20 7C31 13 31 26 20 33C9 26 9 13 20 7Z" fill="#dff2c4"/><path d="M20 11V31M20 17L15 14M20 22L14.5 19M20 17L25 14M20 22L25.5 19" stroke="#3f8f3a" stroke-width="1.6" stroke-linecap="round" fill="none"/></svg></div>
    <div class="tx"><div class="t" id="t">Tus aciertos de la aventura</div><div class="fl"><span class="n" id="n">0</span><span class="s" id="s"></span></div></div>
    <button class="g" id="b"></button>
  </div>
  <div id="m"></div>
</div>
<script>
/* Uso: cobrar-todo.html?grupo=gua-&ver=1&titulo=Guardalia
   grupo  = (opcional) solo cuenta/cobra los aciertos cuyo id empieza así
   ver=1  = solo MUESTRA cuántos aciertos hay (sin botón de cobrar), para el final de cada aldea
   titulo = (opcional) cambia el título de la tarjeta
   hojas  = hojas por acierto (por defecto 1)
   Sin grupo y sin ver = cobra TODO lo pendiente (botón final) */
const P=new URLSearchParams(location.search),G=P.get('grupo')||'',PER=Math.max(1,Math.min(5,parseInt(P.get('hojas'))||1)),VER=P.get('ver')==='1',TIT=P.get('titulo')||'';
const $=id=>document.getElementById(id);
const leer=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
const lista=k=>{try{return JSON.parse(leer(k))||[]}catch(e){return []}};
const prueba=()=>leer('modo_prueba')==='1';
const pend=()=>{const c=lista('genially_cobrados');return lista('genially_aciertos').filter(id=>id.indexOf(G)===0&&!c.includes(id))};
let conf=false,tm=null;
function pintar(){
  if(TIT)$('t').textContent=TIT;
  if(VER){const tot=lista('genially_aciertos').filter(id=>id.indexOf(G)===0).length;$('n').textContent=tot;$('s').textContent=(tot===1?'acierto guardado':'aciertos guardados');$('b').style.display='none';return}
  const n=pend().length,ya=lista('genially_cobrados').filter(id=>id.indexOf(G)===0).length;
  $('n').textContent=n;
  $('s').textContent=(n===1?'acierto guardado':'aciertos guardados')+' · cada uno = '+PER+(PER===1?' hoja':' hojas')+(ya?' · ya cobrados: '+ya:'');
  $('b').disabled=n===0;
  $('b').textContent=n?(conf?'¿Seguro? Toca otra vez':'🍃 Cobrar '+n*PER+(n*PER===1?' hoja':' hojas')):'Aún no hay aciertos por cobrar';
}
$('b').onclick=()=>{
  const ps=pend();if(!ps.length)return;
  if(!conf){conf=true;pintar();clearTimeout(tm);tm=setTimeout(()=>{conf=false;pintar()},4000);return}
  conf=false;const p=ps.length*PER;
  if(prueba()){$('m').textContent='🧪 Modo prueba: no se contaron'}
  else{
    try{
      ['ranking_exploradores_hojas','hojas_actuales'].forEach(k=>localStorage.setItem(k,(parseInt(localStorage.getItem(k))||0)+p));
      localStorage.setItem('genially_cobrados',JSON.stringify(lista('genially_cobrados').concat(ps)));
      $('m').textContent='✅ ¡Cobraste '+p+(p===1?' hoja!':' hojas!');
    }catch(e){$('m').textContent='No se pudo guardar'}
  }
  pintar();
};
window.addEventListener('storage',pintar);
setInterval(pintar,800);
pintar();
</script>
</body>
</html>
