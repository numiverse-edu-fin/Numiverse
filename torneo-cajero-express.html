<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>El Cajero Express</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:10px;background:transparent;font-family:'Segoe UI',sans-serif;user-select:none}
.shop{max-width:500px;margin:0 auto;border-radius:22px;overflow:hidden;border:3px solid #207168;background:#fffdf2;box-shadow:0 8px 24px rgba(32,113,104,.15);position:relative}
.top{display:flex;justify-content:space-between;align-items:center;background:#207168;color:#fff;padding:8px 12px;font-weight:700;font-size:13px;gap:6px}
.hoja{background:#fff;color:#207168;border-radius:12px;padding:2px 10px}
.mu{background:none;border:0;font-size:16px;cursor:pointer;padding:0}
.tm{height:8px;background:#d9ece7}.tm i{display:block;height:100%;width:100%;background:#2ecc71;transition:width .25s linear,background .3s}
.scene{position:relative;padding:0 10px 12px;background:linear-gradient(#cfe9ff 0%,#fff4d6 100%);min-height:150px;overflow:hidden}
.toldo{height:26px;margin:0 -10px 10px;background:repeating-linear-gradient(90deg,#d94f4f 0 28px,#fff 28px 56px);border-bottom:4px solid #b03a3a;border-radius:0 0 18px 18px}
.cli{display:flex;align-items:center;gap:12px}
.cara{font-size:58px;line-height:1;position:relative;animation:rebota 2.4s ease-in-out infinite}
.cara small{position:absolute;right:-8px;top:-8px;font-size:22px}
@keyframes rebota{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.nombre{font-size:11px;font-weight:800;color:#207168;text-align:center;margin-top:4px}
.dialogo{flex:1;background:#fff;border:2px solid #d4af37;border-radius:16px;padding:8px 10px;position:relative;font-size:14px;color:#34495e;font-weight:700;line-height:1.7}
.dialogo::before{content:'';position:absolute;left:-10px;top:24px;border:8px solid transparent;border-right:10px solid #d4af37;border-left:0}
.etq{display:inline-block;background:#fff4cc;border:2px dashed #d4af37;border-radius:8px;padding:0 8px;font-size:17px;color:#a46a00;font-weight:900}
.pago{display:inline-block;transform:rotate(-3deg);background:linear-gradient(135deg,#9be3a8,#4cb868);border:2px solid #2e7d4f;border-radius:6px;padding:1px 10px;color:#14532d;font-weight:900;font-size:16px}
.caja{background:linear-gradient(#8a5a2b,#6b4423);border-radius:16px;margin:10px;padding:10px;color:#fff}
.lcd{display:flex;gap:6px;margin-bottom:8px}
.lcd div{flex:1;background:#1c2b27;border-radius:8px;padding:4px 6px;text-align:center}
.lcd small{display:block;font-size:9px;color:#8fd8c8;letter-spacing:.08em}
.lcd b{font-family:'Courier New',monospace;font-size:20px;color:#7dffb2}
.bandeja{min-height:64px;background:#f4e3c3;border:3px inset #c9a36a;border-radius:10px;padding:6px;display:flex;flex-wrap:wrap;gap:2px;align-content:flex-start;justify-content:center}
.bandeja .vac{color:#a58a5c;font-size:12px;font-weight:700;align-self:center}
.den{border:0;cursor:pointer;font-weight:900;font-family:inherit;box-shadow:0 3px 0 rgba(0,0,0,.25);transition:transform .1s}
.den:active{transform:translateY(2px) scale(.96)}
.den.c{width:46px;height:46px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe9a0,#d4a017);color:#7a5200;border:3px solid #b8860b;font-size:16px}
.den.b{width:66px;height:40px;border-radius:6px;background:linear-gradient(135deg,#a9e8b5,#52b86b);color:#14532d;border:2px solid #2e7d4f;font-size:16px}
.bandeja .den{transform:scale(.8);margin:-4px;animation:pop .25s ease-out}
@keyframes pop{0%{transform:scale(.3)}100%{transform:scale(.8)}}
.cajon{display:flex;gap:8px;justify-content:center;align-items:center;margin-top:10px;flex-wrap:wrap}
.act{display:flex;gap:10px;padding:0 10px}
.act button{flex:1;padding:13px;font-size:14px;font-weight:800;border:0;border-radius:12px;cursor:pointer;text-transform:uppercase;font-family:inherit}
.b1{background:#207168;color:#fff;box-shadow:0 4px 0 #16524a}.b2{background:#d7e0dd;color:#207168}
.msg{min-height:46px;padding:10px 12px 12px;text-align:center;font-weight:800;font-size:14px;color:#b9650a;line-height:1.35}
.msg.ok{color:#1c8f5a}
.fx{position:absolute;bottom:10%;font-size:24px;animation:sube 1.6s ease-out forwards;pointer-events:none}
@keyframes sube{to{transform:translateY(-170px) rotate(40deg);opacity:0}}
.ov{position:absolute;inset:0;background:rgba(255,253,242,.97);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;z-index:20}
.ov h2{margin:6px 0;color:#207168;font-size:26px}.ov p{margin:6px 0 14px;color:#4a5a56;font-weight:700;font-size:14px;line-height:1.4}
.ov .big{font-size:56px}
.ov button{padding:14px 30px;font-size:16px;font-weight:800;border:0;border-radius:14px;background:#207168;color:#fff;cursor:pointer;box-shadow:0 4px 0 #16524a;font-family:inherit}
</style>
</head>
<body>
<div class="shop" id="shop">
<div class="top"><span>🏪 Cajero Express</span><span class="hoja">🍃 <b id="hj">0</b></span><span id="cl">Cliente 1/5</span><span id="rc"></span><button class="mu" id="mu">🔊</button></div>
<div class="tm"><i id="tb"></i></div>
<div class="scene" id="scene"><div class="toldo"></div>
<div class="cli"><div><div class="cara" id="cara"></div><div class="nombre" id="nom"></div></div><div class="dialogo" id="dlg"></div></div></div>
<div class="caja">
<div class="lcd"><div><small>COBRO</small><b id="lc">0</b></div><div><small>PAGÓ</small><b id="lp">0</b></div><div><small>TU VUELTO</small><b id="lv">0</b></div></div>
<div class="bandeja" id="band"></div>
<div class="cajon" id="cajon"></div>
</div>
<div class="act"><button class="b2" id="bor">Borrar</button><button class="b1" id="ent">Entregar vuelto</button></div>
<div class="msg" id="msg"></div>
<div class="ov" id="ov"></div>
</div>
<script>
const $=id=>document.getElementById(id);
const DEN=[1,5,10,20,50];
const ART=[['🧸','un osito'],['🎈','un globo'],['🍎','unas manzanas'],['🌻','un girasol'],['🧺','una canasta'],['🔔','una campanita'],['🥖','un pan dorado'],['🎁','un regalo']];
const CLI=[['🦊','Sami'],['🐢','Cael'],['🦉','Kiro'],['👵','La abuela'],['🦝','Riku']];
const TOTAL=5, TIEMPO=45;
let i=0,hojas=0,racha=0,aciertos=0,tray=[],err=0,tleft=0,timer=null,bloq=true,costo=0,pago=0,need=0,mute=false,ac=null;

function tono(f,d){if(mute)return;try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.type='triangle';o.frequency.value=f;g.gain.value=.07;o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+d)}catch(e){}}
$('mu').onclick=()=>{mute=!mute;$('mu').textContent=mute?'🔇':'🔊'};

function r(n){return Math.floor(Math.random()*n)}
function precio(k){
  if(k<3)return 5+5*r(9);          // 5 a 45
  if(k===3)return 55+5*r(9);       // 55 a 95
  return 5+5*r(19);                // 5 a 95
}
function sumTray(){return tray.reduce((a,b)=>a+b,0)}
function msg(t,ok){$('msg').textContent=t;$('msg').className='msg'+(ok?' ok':'')}
function ov(h){$('ov').style.display=h?'flex':'none';$('ov').innerHTML=h||''}

function portada(){
  ov('<div class="big">🏪</div><h2>El Cajero Express</h2><p>Atiende a 5 clientes de la feria de Guardalia.<br>Cada vuelto correcto gana <b>5 Hojas de la Sabiduría</b> 🍃<br>¡Rápido, que los clientes se impacientan!</p><button id="go">¡Abrir la tienda!</button>');
  $('go').onclick=()=>{i=0;hojas=0;racha=0;aciertos=0;$('hj').textContent=0;ov('');tono(660,.15);cliente()};
}

function cliente(){
  const c=CLI[i],a=ART[r(ART.length)];
  costo=precio(i);pago=(i===2||i===3)?100:(costo<50?50:100);need=pago-costo;
  tray=[];err=0;tleft=TIEMPO;bloq=false;
  $('cl').textContent='Cliente '+(i+1)+'/'+TOTAL;$('rc').textContent=racha>=2?'🔥 x'+racha:'';
  $('cara').innerHTML=c[0]+'<small id="mood">😊</small>';$('nom').textContent=c[1];
  $('dlg').innerHTML='Quiero '+a[1]+' '+a[0]+'<br><span class="etq">'+costo+' Lumis</span> · te pago con <span class="pago">💵 '+pago+'</span>';
  $('lc').textContent=costo;$('lp').textContent=pago;
  msg('Calcula el vuelto y ponlo en la bandeja 👇');
  draw();clearInterval(timer);timer=setInterval(tick,250);
}

function tick(){
  if(bloq)return;
  tleft-=.25;const p=Math.max(0,tleft/TIEMPO);
  $('tb').style.width=(p*100)+'%';$('tb').style.background=p>.5?'#2ecc71':(p>.25?'#f1c40f':'#e74c3c');
  const m=$('mood');if(m)m.textContent=p>.5?'😊':(p>.25?'😐':'😠');
  if(tleft<=0)fuga(true);
}

function den(v,fn){const b=document.createElement('button');b.className='den '+(v>=20?'b':'c');b.textContent=v;b.onclick=fn;return b}
function draw(){
  const cj=$('cajon');if(!cj.children.length)DEN.forEach(v=>cj.appendChild(den(v,()=>poner(v))));
  const bd=$('band');bd.innerHTML='';
  if(!tray.length)bd.innerHTML='<span class="vac">Toca las monedas y billetes para dar el vuelto</span>';
  tray.slice().sort((a,b)=>b-a).forEach(v=>{bd.appendChild(den(v,()=>quitar(v)))});
  $('lv').textContent=sumTray();
}
function poner(v){if(bloq||tray.length>=18)return;tray.push(v);tono(500+v*8,.08);draw()}
function quitar(v){if(bloq)return;const k=tray.indexOf(v);if(k>=0)tray.splice(k,1);tono(300,.06);draw()}
$('bor').onclick=()=>{if(bloq)return;tray=[];draw();msg('Bandeja vacía. ¡Empieza de nuevo!')};

function fx(){const s=$('scene');for(let k=0;k<10;k++){const e=document.createElement('span');e.className='fx';e.textContent='🍃';e.style.left=(8+Math.random()*80)+'%';e.style.animationDelay=(k*60)+'ms';s.appendChild(e);setTimeout(()=>e.remove(),1900)}}

$('ent').onclick=()=>{
  if(bloq)return;
  if(!tray.length){msg('Primero pon el vuelto en la bandeja 👆');return}
  if(sumTray()===need){exito();return}
  err++;tono(180,.25);
  if(err===1)msg('😕 ¡Ese no es mi vuelto! Cuenta otra vez, con calma.');
  else if(err===2)msg('💡 Pista: pagué con '+pago+' y mi compra costó '+costo+'. ¿Cuánto me debes?');
  else fuga(false);
};

function exito(){
  bloq=true;clearInterval(timer);aciertos++;racha++;hojas+=5;
  $('hj').textContent=hojas;$('mood').textContent='😄';
  try{
    let rk=parseInt(localStorage.getItem('ranking_exploradores_hojas'))||0;localStorage.setItem('ranking_exploradores_hojas',rk+5);
    let bi=parseInt(localStorage.getItem('hojas_actuales'))||0;localStorage.setItem('hojas_actuales',bi+5);
  }catch(e){}
  fx();tono(880,.12);setTimeout(()=>tono(1175,.18),130);
  msg('¡Vuelto correcto! +5 Hojas 🍃',true);
  setTimeout(siguiente,2200);
}
function fuga(tiempo){
  bloq=true;clearInterval(timer);racha=0;$('rc').textContent='';
  const m=$('mood');if(m)m.textContent='😤';tono(150,.35);
  msg((tiempo?'⏰ ¡Se cansó de esperar! ':'😕 Mejor otro día. ')+'El vuelto era '+need+' ('+pago+' − '+costo+').');
  setTimeout(siguiente,3600);
}
function siguiente(){
  i++;if(i<TOTAL){cliente();return}
  const est=aciertos>=5?'⭐⭐⭐':(aciertos>=3?'⭐⭐':(aciertos>=1?'⭐':'💪'));
  ov('<div class="big">'+est+'</div><h2>¡Turno terminado!</h2><p>Atendiste bien a <b>'+aciertos+' de '+TOTAL+'</b> clientes.<br>Ganaste <b>'+hojas+' Hojas de la Sabiduría</b> 🍃</p><button id="again">Jugar otra vez</button>');
  $('again').onclick=portada;tono(784,.15);
}
portada();
</script>
</body>
</html>
