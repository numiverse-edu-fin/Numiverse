<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>El Cajero Express</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:10px;background:transparent;font-family:'Segoe UI',sans-serif;user-select:none}
.shop{max-width:500px;margin:0 auto;border-radius:22px;overflow:hidden;border:3px solid #207168;background:#fffdf2;box-shadow:0 8px 24px rgba(32,113,104,.15);position:relative;min-height:560px}
.top{display:flex;justify-content:space-between;align-items:center;background:#207168;color:#fff;padding:8px 12px;font-weight:700;font-size:13px;gap:6px}
.hoja{background:#fff;color:#207168;border-radius:12px;padding:2px 10px;transition:transform .2s}
.hoja.sube{transform:scale(1.25)}
.mu{background:none;border:0;font-size:16px;cursor:pointer;padding:0}
.pg{height:6px;background:#bfe0d8}.pg i{display:block;height:100%;width:0;background:#d4af37;transition:width .4s}
.tm{height:8px;background:#d9ece7}.tm i{display:block;height:100%;width:100%;background:#2ecc71;transition:width .25s linear,background .3s}
.scene{position:relative;padding:0 10px 12px;background:linear-gradient(#cfe9ff 0%,#fff4d6 100%);min-height:150px;overflow:hidden}
.toldo{height:26px;margin:0 -10px 10px;background:repeating-linear-gradient(90deg,#d94f4f 0 28px,#fff 28px 56px);border-bottom:4px solid #b03a3a;border-radius:0 0 18px 18px}
.cli{display:flex;align-items:center;gap:12px}
.cara{font-size:58px;line-height:1;position:relative;animation:rebota 2.4s ease-in-out infinite}
.cara small{position:absolute;right:-8px;top:-8px;font-size:22px}
@keyframes rebota{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.nombre{font-size:11px;font-weight:800;color:#207168;text-align:center;margin-top:4px}
.dialogo{flex:1;background:#fff;border:2px solid #d4af37;border-radius:16px;padding:8px 10px;position:relative;font-size:14px;color:#34495e;font-weight:700;line-height:1.7}
.dialogo::before{content:'';position:absolute;left:-10px;top:24px;border:8px solid transparent;border-right:10px solid #d4af37;border-left:0}
.etq{display:inline-block;background:#fff4cc;border:2px dashed #d4af37;border-radius:8px;padding:0 8px;font-size:17px;color:#a46a00;font-weight:900}
.pago{display:inline-block;transform:rotate(-3deg);background:linear-gradient(135deg,#9be3a8,#4cb868);border:2px solid #2e7d4f;border-radius:6px;padding:1px 10px;color:#14532d;font-weight:900;font-size:16px}
.caja{background:linear-gradient(#8a5a2b,#6b4423);border-radius:16px;margin:10px;padding:10px;color:#fff}
.lcd{display:flex;gap:6px;margin-bottom:8px}
.lcd div{flex:1;background:#1c2b27;border-radius:8px;padding:4px 6px;text-align:center}
.lcd small{display:block;font-size:9px;color:#8fd8c8;letter-spacing:.08em}
.lcd b{font-family:'Courier New',monospace;font-size:20px;color:#7dffb2}
.bandeja{min-height:64px;background:#f4e3c3;border:3px inset #c9a36a;border-radius:10px;padding:6px;display:flex;flex-wrap:wrap;gap:2px;align-content:flex-start;justify-content:center}
.bandeja .vac{color:#a58a5c;font-size:12px;font-weight:700;align-self:center}
.den{border:0;cursor:pointer;font-weight:900;font-family:inherit;box-shadow:0 3px 0 rgba(0,0,0,.25);transition:transform .1s}
.den:active{transform:translateY(2px) scale(.96)}
.den.c{width:44px;height:44px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe9a0,#d4a017);color:#7a5200;border:3px solid #b8860b;font-size:15px}
.den.b{width:58px;height:38px;border-radius:6px;background:linear-gradient(135deg,#a9e8b5,#52b86b);color:#14532d;border:2px solid #2e7d4f;font-size:15px}
.den.g{background:linear-gradient(135deg,#9fc7f5,#4f8fd9);color:#0f3a73;border-color:#2c6bb3}
.bandeja .den{transform:scale(.8);margin:-4px;animation:pop .25s ease-out}
@keyframes pop{0%{transform:scale(.3)}100%{transform:scale(.8)}}
.cajon{display:flex;gap:6px;justify-content:center;align-items:center;margin-top:10px;flex-wrap:wrap}
.act{display:flex;gap:10px;padding:0 10px}
.act button{flex:1;padding:13px;font-size:14px;font-weight:800;border:0;border-radius:12px;cursor:pointer;text-transform:uppercase;font-family:inherit}
.b1{background:#207168;color:#fff;box-shadow:0 4px 0 #16524a}.b2{background:#d7e0dd;color:#207168}
.msg{min-height:46px;padding:10px 12px 12px;text-align:center;font-weight:800;font-size:14px;color:#b9650a;line-height:1.35}
.msg.ok{color:#1c8f5a}
.fx{position:absolute;bottom:10%;font-size:24px;animation:sube 1.6s ease-out forwards;pointer-events:none}
@keyframes sube{to{transform:translateY(-170px) rotate(40deg);opacity:0}}
.ov{position:absolute;inset:0;background:rgba(255,253,242,.98);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:18px;z-index:20}
.ov h2{margin:6px 0;color:#207168;font-size:24px}.ov p{margin:6px 0 12px;color:#4a5a56;font-weight:700;font-size:14px;line-height:1.4}
.ov .big{font-size:52px}
.ov button.go{padding:13px 28px;font-size:16px;font-weight:800;border:0;border-radius:14px;background:#207168;color:#fff;cursor:pointer;box-shadow:0 4px 0 #16524a;font-family:inherit;margin:4px}
.ov button.sec{background:none;border:0;color:#207168;font-weight:700;cursor:pointer;text-decoration:underline;font-size:13px;font-family:inherit;margin:2px}
.ov input{font-size:18px;font-weight:700;text-align:center;padding:10px;border:3px solid #207168;border-radius:12px;width:200px;font-family:inherit;color:#207168}
.avs{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin:12px 0;max-width:330px}
.av{font-size:28px;background:#fff;border:3px solid #d7e0dd;border-radius:12px;cursor:pointer;padding:4px 0}
.av.sel{border-color:#d4af37;background:#fff4cc;transform:scale(1.1)}
.pe{color:#c0392b;font-weight:800;font-size:13px;min-height:18px}
</style>
</head>
<body>
<div class="shop" id="shop">
<div class="top"><span id="yo">🏪 Cajero Express</span><span class="hoja" id="hjw">🍃 <b id="hj">0</b></span><span id="cl">Cliente 1/50</span><span id="rc"></span><button class="mu" id="mu">🔊</button></div>
<div class="pg"><i id="pgb"></i></div>
<div class="tm"><i id="tb"></i></div>
<div class="scene" id="scene"><div class="toldo"></div>
<div class="cli"><div><div class="cara" id="cara">🦊</div><div class="nombre" id="nom"></div></div><div class="dialogo" id="dlg"></div></div></div>
<div class="caja">
<div class="lcd"><div><small>COBRO</small><b id="lc">0</b></div><div><small>PAGÓ</small><b id="lp">0</b></div><div><small>TU VUELTO</small><b id="lv">0</b></div></div>
<div class="bandeja" id="band"></div>
<div class="cajon" id="cajon"></div>
</div>
<div class="act"><button class="b2" id="bor">Borrar</button><button class="b1" id="ent">Entregar vuelto</button></div>
<div class="msg" id="msg"></div>
<div class="ov" id="ov"></div>
</div>
<script>
// Para el ranking en línea: pega aquí la dirección (URL) de tu Apps Script. Si la dejas vacía, tus hojas se guardan solo en este navegador.
const API_URL="";

const $=id=>document.getElementById(id);
const DEN=[1,5,10,20,50,100];
const ART=[['🧸','un osito'],['🎈','un globo'],['🍎','unas manzanas'],['🌻','un girasol'],['🧺','una canasta'],['🔔','una campanita'],['🥖','un pan dorado'],['🎁','un regalo']];
const CLI=[['🦊','Sami'],['🐢','Cael'],['🦉','Kiro'],['👵','La abuela'],['🦝','Riku']];
const AV=['🦝','🦊','🐢','🦉','🐿️','🐰','🦋','🐞','🐸','🦄','🐼','🐯'];
const TOTAL=50;
let i=0,hojas=0,total=0,prog=0,racha=0,aciertos=0,tray=[],err=0,tleft=0,tmax=45,timer=null,bloq=true,costo=0,pago=0,need=0,mute=false,ac=null,perfil=null;

function tono(f,d){if(mute)return;try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.type='triangle';o.frequency.value=f;g.gain.value=.07;o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+d)}catch(e){}}
$('mu').onclick=()=>{mute=!mute;$('mu').textContent=mute?'🔇':'🔊'};
function r(n){return Math.floor(Math.random()*n)}
function sumTray(){return tray.reduce((a,b)=>a+b,0)}
function msg(t,ok){$('msg').textContent=t;$('msg').className='msg'+(ok?' ok':'')}
function ov(h){$('ov').style.display=h?'flex':'none';$('ov').innerHTML=h||''}

/* ---------- perfil y guardado ---------- */
function cargar(){try{perfil=JSON.parse(localStorage.getItem('cajero_perfil')||'null');total=parseInt(localStorage.getItem('cajero_total'))||0;prog=parseInt(localStorage.getItem('cajero_prog'))||0}catch(e){}}
function guardar(){try{localStorage.setItem('cajero_perfil',JSON.stringify(perfil));localStorage.setItem('cajero_total',total);localStorage.setItem('cajero_prog',prog)}catch(e){}}
function sync(){if(!API_URL||!perfil)return;try{fetch(API_URL,{method:'POST',mode:'no-cors',body:JSON.stringify({id:perfil.id,nombre:perfil.nombre,avatar:perfil.avatar,hojas:total})}).catch(()=>{})}catch(e){}}
function cabecera(){$('hj').textContent=total;$('yo').textContent=perfil?perfil.avatar+' '+perfil.nombre:'🏪 Cajero Express'}

function pantallaPerfil(){
  let sel=perfil?perfil.avatar:AV[0];
  ov('<div class="big">👤</div><h2>¿Quién juega?</h2><p>Elige un apodo (sin apellidos) y tu avatar.</p><input id="nm" maxlength="12" placeholder="Tu apodo"><div class="avs" id="avs"></div><div class="pe" id="pe"></div><button class="go" id="ok">¡Listo!</button>');
  if(perfil)$('nm').value=perfil.nombre;
  const a=$('avs');
  AV.forEach(e=>{const b=document.createElement('button');b.className='av'+(e===sel?' sel':'');b.textContent=e;b.onclick=()=>{sel=e;[].forEach.call(a.children,x=>x.classList.remove('sel'));b.classList.add('sel');tono(600,.08)};a.appendChild(b)});
  $('ok').onclick=()=>{const n=$('nm').value.replace(/[<>]/g,'').trim().slice(0,12);if(!n){$('pe').textContent='Escribe tu apodo para continuar';return}
    perfil={id:perfil?perfil.id:'p'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),nombre:n,avatar:sel};guardar();sync();cabecera();portada()};
}

function portada(){
  cabecera();
  const cont=prog>0&&prog<TOTAL;
  ov('<div class="big">'+perfil.avatar+'</div><h2>¡Hola, '+perfil.nombre+'!</h2><p>Atiende a 50 clientes de la feria de Guardalia.<br>Cada vuelto correcto gana <b>5 Hojas de la Sabiduría</b> 🍃<br>Llevas <b>'+total+'</b> hojas en total.</p>'+
    '<button class="go" id="go">'+(cont?'Continuar (cliente '+(prog+1)+'/50)':'¡Abrir la tienda!')+'</button>'+(cont?'<button class="sec" id="nv">Empezar desde el cliente 1</button>':'')+'<button class="sec" id="cp">Cambiar apodo o avatar</button>');
  $('go').onclick=()=>{i=cont?prog:0;hojas=0;racha=0;aciertos=0;ov('');tono(660,.15);cliente()};
  if(cont)$('nv').onclick=()=>{i=0;prog=0;guardar();hojas=0;racha=0;aciertos=0;ov('');cliente()};
  $('cp').onclick=pantallaPerfil;
}

/* ---------- juego ---------- */
function genera(k){
  const n=Math.floor(k/10);let c,p;
  if(n===0){c=5+5*r(9);p=50}
  else if(n===1){c=5+5*r(9);p=100}
  else if(n===2){c=55+5*r(9);p=100}
  else if(n===3){c=5+5*r(19);p=c<50?50:100}
  else{c=5+5*r(39);p=c<100?((c<50&&r(2))?50:100):200}
  return [c,p];
}
function cliente(){
  const c=CLI[i%5],a=ART[r(ART.length)],g=genera(i);costo=g[0];pago=g[1];need=pago-costo;
  tray=[];err=0;tmax=45-2*Math.floor(i/10);tleft=tmax;bloq=false;
  $('cl').textContent='Cliente '+(i+1)+'/'+TOTAL;$('rc').textContent=racha>=2?'🔥 x'+racha:'';$('pgb').style.width=(i/TOTAL*100)+'%';
  $('cara').innerHTML=c[0]+'<small id="mood">😊</small>';$('nom').textContent=c[1];
  $('dlg').innerHTML='Quiero '+a[1]+' '+a[0]+'<br><span class="etq">'+costo+' Lumis</span> · te pago con <span class="pago">💵 '+pago+'</span>';
  $('lc').textContent=costo;$('lp').textContent=pago;
  msg('Calcula el vuelto y ponlo en la bandeja 👇');
  draw();clearInterval(timer);timer=setInterval(tick,250);
}
function tick(){
  if(bloq)return;
  tleft-=.25;const p=Math.max(0,tleft/tmax);
  $('tb').style.width=(p*100)+'%';$('tb').style.background=p>.5?'#2ecc71':(p>.25?'#f1c40f':'#e74c3c');
  const m=$('mood');if(m)m.textContent=p>.5?'😊':(p>.25?'😐':'😠');
  if(tleft<=0)fuga(true);
}
function den(v,fn){const b=document.createElement('button');b.className='den '+(v>=20?'b':'c')+(v===100?' g':'');b.textContent=v;b.onclick=fn;return b}
function draw(){
  const cj=$('cajon');if(!cj.children.length)DEN.forEach(v=>cj.appendChild(den(v,()=>poner(v))));
  const bd=$('band');bd.innerHTML='';
  if(!tray.length)bd.innerHTML='<span class="vac">Toca las monedas y billetes para dar el vuelto</span>';
  tray.slice().sort((a,b)=>b-a).forEach(v=>{bd.appendChild(den(v,()=>quitar(v)))});
  $('lv').textContent=sumTray();
}
function poner(v){if(bloq||tray.length>=20)return;tray.push(v);tono(500+Math.min(v,50)*8,.08);draw()}
function quitar(v){if(bloq)return;const k=tray.indexOf(v);if(k>=0)tray.splice(k,1);tono(300,.06);draw()}
$('bor').onclick=()=>{if(bloq)return;tray=[];draw();msg('Bandeja vacía. ¡Empieza de nuevo!')};
function fx(){const s=$('scene');for(let k=0;k<10;k++){const e=document.createElement('span');e.className='fx';e.textContent='🍃';e.style.left=(8+Math.random()*80)+'%';e.style.animationDelay=(k*60)+'ms';s.appendChild(e);setTimeout(()=>e.remove(),1900)}}

$('ent').onclick=()=>{
  if(bloq)return;
  if(!tray.length){msg('Primero pon el vuelto en la bandeja 👆');return}
  if(sumTray()===need){exito();return}
  err++;tono(180,.25);
  if(err===1)msg('😕 ¡Ese no es mi vuelto! Cuenta otra vez, con calma.');
  else if(err===2)msg('💡 Pista: pagué con '+pago+' y mi compra costó '+costo+'. ¿Cuánto me debes?');
  else fuga(false);
};
function exito(){
  bloq=true;clearInterval(timer);aciertos++;racha++;hojas+=5;total+=5;
  $('mood').textContent='😄';$('hj').textContent=total;$('hjw').classList.add('sube');setTimeout(()=>$('hjw').classList.remove('sube'),350);
  try{let a=parseInt(localStorage.getItem('ranking_exploradores_hojas'))||0;localStorage.setItem('ranking_exploradores_hojas',a+5);let b=parseInt(localStorage.getItem('hojas_actuales'))||0;localStorage.setItem('hojas_actuales',b+5)}catch(e){}
  prog=i+1;guardar();sync();
  fx();tono(880,.12);setTimeout(()=>tono(1175,.18),130);
  msg('¡Vuelto correcto! +5 Hojas 🍃',true);
  setTimeout(siguiente,2000);
}
function fuga(tiempo){
  bloq=true;clearInterval(timer);racha=0;$('rc').textContent='';
  const m=$('mood');if(m)m.textContent='😤';tono(150,.35);
  msg((tiempo?'⏰ ¡Se cansó de esperar! ':'😕 Mejor otro día. ')+'El vuelto era '+need+' ('+pago+' − '+costo+').');
  prog=i+1;guardar();
  setTimeout(siguiente,3600);
}
function siguiente(){
  i++;prog=i;guardar();
  if(i>=TOTAL){fin();return}
  if(i%10===0){const n=i/10;ov('<div class="big">🎉</div><h2>¡Nivel '+n+' completado!</h2><p>Llevas <b>'+total+'</b> 🍃 Hojas de la Sabiduría.<br>Ahora vienen vueltos más difíciles.</p><button class="go" id="nx">Seguir</button>');$('nx').onclick=()=>{ov('');cliente()};tono(784,.2);return}
  cliente();
}
function fin(){
  prog=0;guardar();$('pgb').style.width='100%';
  const est=aciertos>=45?'🏆':(aciertos>=30?'⭐⭐⭐':(aciertos>=15?'⭐⭐':'⭐'));
  ov('<div class="big">'+est+'</div><h2>¡Turno terminado!</h2><p>Atendiste bien a <b>'+aciertos+' de '+TOTAL+'</b> clientes.<br>Ganaste <b>'+hojas+'</b> hojas en esta partida y llevas <b>'+total+'</b> 🍃 en total.</p><button class="go" id="again">Jugar otra vez</button>');
  $('again').onclick=portada;tono(784,.15);
}
cargar();cabecera();if(perfil)portada();else pantallaPerfil();
</script>
</body>
</html>
