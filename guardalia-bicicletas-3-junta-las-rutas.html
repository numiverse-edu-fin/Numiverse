<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bicicletas 3 Numiverse</title>
<style>
body{font-family:'Segoe UI',sans-serif;background:transparent;text-align:center;padding:6px;margin:0;user-select:none}
.game-box{width:100%;max-width:460px;margin:0 auto;box-sizing:border-box;background:linear-gradient(135deg,#fffdf2,#f3faf6);padding:14px;border-radius:18px;border:2px solid #207168;box-shadow:0 4px 15px rgba(32,113,104,.08);position:relative;overflow:hidden;min-height:400px;display:flex;flex-direction:column;justify-content:space-between}
.ins{display:flex;align-items:center;gap:8px;background:#207168;color:#fff;padding:8px;border-radius:10px;margin-bottom:8px}
.ins p{font-size:13px;font-weight:bold;text-align:left;flex:1;margin:0;line-height:1.3}
.aud{background:#d4af37;border:0;border-radius:50%;width:30px;height:30px;font-size:14px;cursor:pointer;flex-shrink:0;color:#fff;box-shadow:0 2px 4px rgba(0,0,0,.15)}
.dots{display:flex;justify-content:center;align-items:center;gap:6px;margin-bottom:8px;font-size:11px;font-weight:bold;color:#207168}
.dots i{width:10px;height:10px;border-radius:50%;background:#dfeee7;border:2px solid #207168;display:inline-block}
.dots i.now{background:#d4af37;border-color:#b8860b}.dots i.done{background:#207168}
.zona{background:#fff;border:2px dashed #207168;border-radius:12px;padding:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.rab{border:1px solid #d4af37;background:#fffcf2;border-radius:10px;padding:2px;cursor:pointer;transition:transform .15s}
.rab svg{width:100%;height:74px;display:block}
.rab.ok{background:#d8f3e4;border-color:#1c8f5a;transform:scale(1.06);box-shadow:0 0 10px #f2c94c}
.rab.no,.opt.no,.seed.no{animation:shake .4s}.rab.ayuda{animation:pulso .9s infinite;border-color:#b8860b;box-shadow:0 0 10px #f2c94c}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes pulso{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.slots{display:flex;gap:6px;justify-content:center;margin-bottom:8px}
.slot{flex:1;height:32px;border:2px dashed #d4af37;border-radius:8px;font-weight:800;color:#d4af37;line-height:28px;font-size:15px;background:#fff}
.slot.llena{border:2px solid #1c8f5a;background:#d8f3e4;color:#207168}
.escs{display:flex;align-items:flex-end;gap:6px;height:132px}
.esc{flex:1;background:linear-gradient(#d9a15b,#b07a3c);border-radius:8px 8px 0 0;color:#fff7e0;font-size:20px;font-weight:800;padding-top:6px;box-sizing:border-box;line-height:1.1}
.esc.falta{background:#fff;border:3px dashed #d4af37;color:#d4af37}.esc.llena{background:#d8f3e4;border:2px solid #1c8f5a;color:#207168}
.ops{display:flex;gap:8px;justify-content:center;margin-top:10px}
.opt{min-width:62px;min-height:48px;font-size:22px;font-weight:800;color:#207168;background:#fff;border:3px solid #207168;border-radius:14px;cursor:pointer;font-family:inherit}
.opt.ok{background:#d8f3e4;border-color:#1c8f5a}.opt.ayuda{animation:pulso .9s infinite;border-color:#b8860b;box-shadow:0 0 10px #f2c94c}
.par{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:10px}
.card{min-width:64px;padding:12px 8px;border-radius:12px;background:#fffcf2;border:1px solid #d4af37;font-size:26px;font-weight:800;color:#207168}
.card.hole{border:3px dashed #d4af37;color:#d4af37;background:#fff}.card.llena{border:2px solid #1c8f5a;background:#d8f3e4;color:#207168}.flecha{font-size:22px;color:#207168}
.fila{display:flex;gap:6px;justify-content:center;background:#fff;padding:10px;border-radius:12px;border:2px dashed #207168}
.cel,.hueco{flex:1;min-width:0;height:62px;display:flex;align-items:center;justify-content:center;border-radius:10px;font-size:22px;font-weight:800;color:#207168;position:relative}
.cel{background:#fffcf2;border:1px solid #d4af37}.hueco{border:3px dashed #d4af37;background:#fff;color:#d4af37}
.hueco.over{background:#eaf6ef;border-color:#207168}.hueco.llena{border:2px solid #1c8f5a;background:#d8f3e4;color:#207168;animation:brota .4s ease-out}
.hueco.llena .p{position:absolute;top:-2px;left:3px;font-size:13px}@keyframes brota{0%{transform:scale(.6)}100%{transform:scale(1)}}
.et{font-size:10px;font-weight:bold;color:#207168;margin:8px 0 4px}
.sem{display:flex;justify-content:center;align-items:center;gap:12px;flex-wrap:wrap;background:#fff;padding:8px;border-radius:12px;border:2px dashed #207168;min-height:72px}
.seed{width:52px;height:56px;border:0;cursor:grab;background:linear-gradient(145deg,#c9904f,#9a6a30);color:#fff7e0;font-size:20px;font-weight:800;border-radius:50% 50% 50% 50%/62% 62% 38% 38%;box-shadow:0 3px 6px rgba(0,0,0,.2);touch-action:none;font-family:inherit}
.seed.sel{outline:4px solid #f2c94c;transform:scale(1.1)}
.ghost{position:fixed;z-index:1000;width:52px;height:56px;line-height:56px;text-align:center;font-size:20px;font-weight:800;color:#fff7e0;background:linear-gradient(145deg,#c9904f,#9a6a30);border-radius:50% 50% 50% 50%/62% 62% 38% 38%;pointer-events:none;transform:translate(-50%,-60%);filter:drop-shadow(0 4px 6px rgba(0,0,0,.25));display:none}
.fb{font-size:14px;font-weight:bold;margin-top:8px;color:#b9650a;min-height:40px;line-height:1.35}
.vic{display:none;position:absolute;top:0;left:0;width:100%;height:100%;background:#fffdf2;align-items:center;justify-content:center;flex-direction:column;animation:cel .5s ease-out forwards;z-index:10}
.vt{font-size:28px;color:#27ae60;font-weight:900;margin:8px}.va{font-size:32px;color:#e6b800;font-weight:900;text-shadow:1px 1px 0 #fff}.vn{font-size:14px;color:#207168;font-weight:bold;margin-top:8px;padding:0 14px}
@keyframes cel{0%{transform:scale(.5);opacity:0}100%{transform:scale(1);opacity:1}}

.fl{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;min-height:40px;align-items:center}
.pk{border:2px solid #d4af37;background:#fffcf2;border-radius:10px;font-size:20px;width:38px;height:36px;cursor:pointer;padding:0}
.pk.az{border-color:#4F95DE}.pk.vd{border-color:#4DB37A}
.cad{display:flex;padding:14px 4px}
.lk{flex:1;min-width:0;height:36px;border:4px solid #8a8f98;border-radius:12px;background:#fff;margin:0 -3px;cursor:pointer;padding:0}
.lk.izq{background:#cfe3fb;border-color:#4F95DE}.lk.der{background:#d8f3e4;border-color:#4DB37A}.lk.fin{margin-right:14px}
.tj{border:2px solid #d4af37;background:#fffcf2;border-radius:10px;padding:6px;cursor:pointer;min-height:60px;display:flex;align-items:center;justify-content:center}
.tj.sel{outline:4px solid #f2c94c}.tj.ok{background:#d8f3e4;border-color:#1c8f5a;opacity:.6}.tj.no{animation:shake .4s}
.tj.ayuda{animation:pulso .9s infinite;border-color:#b8860b;box-shadow:0 0 10px #f2c94c}
.gs{font-size:13px;line-height:1.15;word-break:break-all;max-width:90px}
.res{font-size:12px;font-weight:bold;color:#207168;min-height:16px;margin-top:6px}
</style>
</head>
<body>
<div class="game-box">
<div class="vic" id="vic"><div class="vt">¡LO LOGRASTE! 🎉</div><div class="va">+15 LUMIS</div><div class="vn">¡Ya sabes juntar dos grupos!</div></div>
<div>
<div class="ins"><button class="aud" onclick="speakText()">🔊</button><p id="question-text">Pasa todos los paquetes al carrito y cuéntalos.</p></div>
<div class="dots" id="dots"></div>
<div class="zona"><div class="et">RUTA AZUL</div><div class="fl" id="rutaA"></div><div class="et">RUTA VERDE</div><div class="fl" id="rutaB"></div></div><div class="et">CARRITO 🛒</div><div class="zona fl" id="cart"></div><div class="ops" id="ops"></div><div class="res" id="res"></div>
</div>
<div><div class="fb" id="msg"></div></div>
</div>
<script>
// MENSAJES FIJOS (para grabarlos con una voz real) y direcciones de audio: pega cada enlace en MP3.

const RONDAS=[{a:4,b:3},{a:5,b:5},{a:6,b:7}];
const TEXTOS={cuantas:"¡Todos los paquetes están en el carrito! Ahora dime: ¿cuántos paquetes hay?",q1:"Mmm, casi... Cuenta los paquetes del carrito uno por uno, con tu dedo.",q2:"Hagamos una prueba. Cuenta primero los de la ruta azul y sigue contando con los de la ruta verde. Piénsalo y vuelve a intentar.",q3:"Te ayudo. Mira el número que brilla. Esa es la cantidad que hay en el carrito. ¡Tócalo!",bien:"¡Muy bien! Juntaste las dos rutas.",exito:"¡Lo lograste! Ganaste quince Lumis."};
const MP3={cuantas:"",q1:"",q2:"",q3:"",bien:"",exito:""};
let pa=0,pb=0,c=0,fase=1,tries2=0;
function QTXT(){const r=RONDAS[ronda];return fase===1?'Sami lleva '+palabras(r.a)+' paquetes por la ruta azul y '+palabras(r.b)+' por la ruta verde. Pasa todos al carrito y cuéntalos.':TEXTOS.cuantas}
function iniciar(){const r=RONDAS[ronda];pa=r.a;pb=r.b;c=0;fase=1;tries2=0;bloq=false;$('msg').innerText='';$('res').innerText='';$('ops').innerHTML='';
$('question-text').innerText='Sami lleva '+r.a+' paquetes por la ruta azul y '+r.b+' por la verde. Pasa todos al carrito y cuéntalos.';dots();draw();setTimeout(speakText,500)}
function fila(id,n,cl,k){const z=$(id);z.innerHTML='';for(let i=0;i<n;i++){const b=document.createElement('button');b.className='pk '+cl;b.textContent='📦';b.onclick=()=>cargar(k);z.appendChild(b)}}
function draw(){fila('rutaA',pa,'az','a');fila('rutaB',pb,'vd','b');const z=$('cart');z.innerHTML='';for(let i=0;i<c;i++){const s=document.createElement('span');s.textContent='📦';s.style.fontSize='22px';z.appendChild(s)}}
function cargar(k){if(bloq||fin||fase!==1)return;if(k==='a')pa--;else pb--;c++;leer(palabras(c));draw();if(pa+pb===0)setTimeout(f2,1100)}
function f2(){const r=RONDAS[ronda],t=r.a+r.b;fase=2;bloq=false;tries2=0;$('question-text').innerText='¡Todos están en el carrito! ¿Cuántos paquetes hay?';
const o=$('ops');o.innerHTML='';mezclar([t,t-1,t+1]).forEach(n=>{const b=document.createElement('button');b.className='opt';b.dataset.n=n;b.textContent=n;b.onclick=()=>elegir(n,b);o.appendChild(b)});msg('cuantas')}
function elegir(n,b){if(bloq||fin)return;const r=RONDAS[ronda],t=r.a+r.b;
if(n===t){bloq=true;b.classList.add('ok');$('res').innerText=r.a+' y '+r.b+' juntos son '+t+'.';msg('bien');pasar(3200);return}
tries2++;b.classList.add('no');setTimeout(()=>b.classList.remove('no'),600);
if(tries2===1)msg('q1');else if(tries2===2)msg('q2');else{document.querySelectorAll('.opt').forEach(x=>{if(+x.dataset.n===t)x.classList.add('ayuda')});msg('q3')}}


const $=id=>document.getElementById(id);
const U=['cero','uno','dos','tres','cuatro','cinco','seis','siete','ocho','nueve','diez','once','doce','trece','catorce','quince','dieciséis','diecisiete','dieciocho','diecinueve','veinte','veintiuno','veintidós','veintitrés','veinticuatro','veinticinco','veintiséis','veintisiete','veintiocho','veintinueve'];
const D=['','','','treinta','cuarenta','cincuenta','sesenta','setenta','ochenta','noventa'];
function palabras(n){if(n<30)return U[n];const d=Math.floor(n/10),u=n%10;return D[d]+(u?' y '+U[u]:'')}
let ronda=0,tries=0,bloq=false,fin=false,voz=null,audio=null;
function elegirVoz(){if(!('speechSynthesis' in window))return;const vs=speechSynthesis.getVoices().filter(v=>v.lang.toLowerCase().indexOf('es')===0);if(!vs.length)return;
const pt=v=>{const n=v.name.toLowerCase(),l=v.lang.toLowerCase();let s=0;if(/natural|online/.test(n))s+=6;if(/google/.test(n))s+=4;
if(/paulina|monica|mónica|sabina|dalia|elvira|helena|lucia|lucía|paloma|luciana|camila|salome|salomé|valentina|sofia|sofía|marisol/.test(n))s+=3;
if(/es-pe|es-mx|es-us|es-419|es-co|es-ar/.test(l))s+=2;if(/jorge|diego|pablo|raul|raúl/.test(n))s-=1;return s};
voz=vs.sort((a,b)=>pt(b)-pt(a))[0]}
if('speechSynthesis' in window){elegirVoz();speechSynthesis.onvoiceschanged=elegirVoz}
function hablar(k){if(audio){audio.pause();audio=null}if(MP3[k]){audio=new Audio(MP3[k]);audio.play().catch(()=>leer(TEXTOS[k]));return}leer(TEXTOS[k])}
function leer(t){if(!('speechSynthesis' in window))return;speechSynthesis.cancel();
const fr=t.replace(/[^\u0020-\u007E\u00A1-\u00FF]/g,' ').replace(/([.!?])\s+/g,'$1|').split('|');
fr.forEach(f=>{if(!f.trim())return;const u=new SpeechSynthesisUtterance(f.trim());u.lang=voz?voz.lang:'es-MX';if(voz)u.voice=voz;u.rate=.88;
u.pitch=f.indexOf('¡')>=0?1.25:(f.indexOf('¿')>=0?1.18:1.08);speechSynthesis.speak(u)})}
function speakText(){leer(QTXT())}
function msg(k){$('msg').innerText=TEXTOS[k];hablar(k)}
function dots(){let h='';for(let i=0;i<RONDAS.length;i++)h+='<i class="'+(i<ronda?'done':(i===ronda?'now':''))+'"></i>';$('dots').innerHTML=h+'<span>Ronda '+Math.min(ronda+1,RONDAS.length)+' de '+RONDAS.length+'</span>'}
function fallo(b){tries++;if(b){b.classList.add('no');setTimeout(()=>b.classList.remove('no'),600)}if(tries===1)msg('p1');else if(tries===2)msg('p2');return tries>=3}
function pasar(ms){setTimeout(()=>{ronda++;if(ronda>=RONDAS.length)ganar();else iniciar()},ms)}
function ganar(){fin=true;dots();$('vic').style.display='flex';hablar('exito');try{if(!localStorage.getItem(CLAVE)){localStorage.setItem(CLAVE,'1');let w=parseInt(localStorage.getItem('savedLumis'))||0;localStorage.setItem('savedLumis',w+15)}}catch(e){}}
function mezclar(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function svgRab(n){return '<svg viewBox="0 0 80 100"><path d="M40 34C30 18 20 14 14 6c14 0 24 6 26 22C42 14 52 8 66 8c-4 8-14 14-26 26z" fill="#3E9B4F"/><circle cx="40" cy="66" r="30" fill="#D93B4A"/><ellipse cx="28" cy="54" rx="6" ry="9" fill="#fff" opacity=".25"/><text x="40" y="77" text-anchor="middle" font-size="28" font-weight="800" fill="#fff" font-family="Segoe UI,Arial,sans-serif">'+n+'</text></svg>'}

const CLAVE='ganado_bicicletas3';
let yaHecho=false;
try{yaHecho=!!localStorage.getItem(CLAVE)}catch(e){}
if(yaHecho){fin=true;ronda=RONDAS.length;dots();$('vic').style.display='flex'}else{iniciar()}
</script>
</body>
</html>
