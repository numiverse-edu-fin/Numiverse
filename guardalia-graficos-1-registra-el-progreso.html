<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reciclaje de Guardalia: Registra el progreso</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:10px;background:transparent;font-family:'Segoe UI',sans-serif;user-select:none}
.shop{min-height:430px;max-width:500px;margin:0 auto;border-radius:22px;overflow:hidden;border:3px solid #207168;background:#fffdf2;box-shadow:0 8px 24px rgba(32,113,104,.15);position:relative}
.top{display:flex;justify-content:space-between;align-items:center;background:#207168;color:#fff;padding:8px 12px;font-weight:700;font-size:13px;gap:6px;flex-wrap:wrap;position:relative;z-index:30}
.hoja{background:#fff;color:#207168;border-radius:12px;padding:2px 10px}
.scene{padding:0 10px 10px;background:linear-gradient(#cfe9ff,#fff4d6)}
.toldo{height:22px;margin:0 -10px 8px;background:repeating-linear-gradient(90deg,#4cb868 0 28px,#fff 28px 56px);border-bottom:4px solid #2e7d4f;border-radius:0 0 18px 18px}
.cli{display:flex;align-items:center;gap:12px}
.cara{font-size:52px;line-height:1;text-align:center}
.nombre{font-size:11px;font-weight:800;color:#207168;text-align:center}
.dialogo{flex:1;background:#fff;border:2px solid #d4af37;border-radius:16px;padding:8px 10px;font-size:14px;color:#34495e;font-weight:700;line-height:1.5}
.panel{margin:8px 10px;padding:8px 10px;background:#fff;border:2px solid #cfe3de;border-radius:14px;color:#34495e;font-weight:700}
table{width:100%;border-collapse:collapse}
td{padding:6px 8px;border-bottom:1px dashed #cfe3de;font-size:15px}
.tl{font-size:22px;letter-spacing:2px;color:#207168;font-weight:900}.tl s{text-decoration-thickness:3px}
.pc{font-size:22px;line-height:1.2}
.ley{margin:6px 0 0;font-size:12px;color:#7a8a86;text-align:right}
.mini td{text-align:center;border:0;font-size:13px;padding:2px}
.gr{display:flex;gap:8px;align-items:flex-end;justify-content:space-around;height:122px;margin-top:8px;border-left:3px solid #207168;border-bottom:3px solid #207168;padding:0 6px;background:repeating-linear-gradient(to top,#e3ece9 0 1px,transparent 1px 12px)}
.col{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;flex:1;height:100%}
.bar{width:100%;max-width:54px;background:linear-gradient(#52b86b,#2e9d52);border-radius:6px 6px 0 0;color:#fff;text-align:center;font-size:13px;line-height:18px}
.lab{font-size:11px;text-align:center;margin-top:2px;line-height:1.1}
.gr.reg{height:136px;align-items:stretch}
.cell{display:block;width:100%;max-width:54px;height:16px;border:1px solid #cfe3de;background:#fff;padding:0;cursor:pointer}
.cell.on{background:linear-gradient(#52b86b,#2e9d52);border-color:#2e7d4f}
.col.mal .cell.on{background:#e8a33d;border-color:#b9650a}
.dia{font-size:11px;text-align:center}
.resp{display:flex;gap:8px;padding:0 10px;flex-wrap:wrap;justify-content:center}
.resp button{flex:1;min-width:90px;padding:13px 8px;font-size:17px;font-weight:800;border:0;border-radius:12px;cursor:pointer;font-family:inherit;background:#207168;color:#fff;box-shadow:0 4px 0 #16524a}
.resp button:active{transform:translateY(2px)}
.resp .b2{background:#d7e0dd;color:#207168;box-shadow:none}
.msg{min-height:30px;padding:6px 12px 10px;text-align:center;font-weight:800;font-size:14px;color:#b9650a;line-height:1.35}
.msg.ok{color:#1c8f5a}
.fx{position:absolute;bottom:10%;font-size:24px;animation:sube 1.6s ease-out forwards;pointer-events:none}
@keyframes sube{to{transform:translateY(-220px) rotate(40deg);opacity:0}}
.ov{position:absolute;inset:0;background:rgba(255,253,242,.97);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;z-index:20;overflow:auto}
.ov h2{margin:6px 0;color:#207168;font-size:25px}.ov p{margin:6px 0 14px;color:#4a5a56;font-weight:700;font-size:14px;line-height:1.4}
.ov .big{font-size:56px}
.ov button{padding:14px 30px;font-size:16px;font-weight:800;border:0;border-radius:14px;background:#207168;color:#fff;cursor:pointer;box-shadow:0 4px 0 #16524a;font-family:inherit}
.pz{background:#fff;color:#207168;border:0;border-radius:12px;padding:3px 10px;font-weight:800;font-size:12px;font-family:inherit;cursor:pointer}
.pz[hidden]{display:none}
.ov button+button{margin-top:10px}
.ov button.sec{background:#d7e0dd;color:#207168;box-shadow:none}
</style>
</head>
<body>
<div class="shop" id="shop">
<div class="top"><span>♻️ Reciclaje de Guardalia</span><span class="hoja">🍃 <b id="hj">0</b></span><span id="rd"></span><button class="pz" id="pz" hidden>⏸ Pausar</button></div>
<div class="scene"><div class="toldo"></div><div class="cli"><div><div class="cara" id="cara"></div><div class="nombre" id="nom"></div></div><div class="dialogo" id="dlg"></div></div></div>
<div class="panel" id="panel"></div>
<div class="resp" id="resp"></div>
<div class="msg" id="msg"></div>
<div class="ov" id="ov"></div>
</div>
<script>
const $=id=>document.getElementById(id);
const MAT=[['🍾','botellas'],['🥫','latas'],['📦','cajas'],['📰','periódicos'],['🥤','vasos']];
const CLI=[['🦊','Sami'],['🐢','Cael'],['🦉','Kiro'],['👵','La abuela'],['🦝','Riku'],['🐰','Lola'],['🐻','Tomás'],['🐼','Pandi'],['🐸','Ramón'],['🐧','Pipo'],['🦁','Leo'],['🐯','Tigra'],['🐵','Moni'],['🐘','Elena'],['🦒','Gira'],['🐷','Pepa'],['🐮','Mimosa'],['🐑','Lana'],['🐴','Rayo'],['🦄','Brillo'],['🐔','Clara'],['🐥','Pío'],['🦆','Patricio'],['🐝','Zumba'],['🐞','Lupita'],['🦋','Mariela'],['🐌','Lenti'],['🐙','Octavio'],['🐬','Delfi'],['🐳','Bruno'],['🦀','Pinza'],['🐠','Burbuja'],['🦜','Lorenzo'],['🦚','Gala'],['🦔','Púas'],['🐿️','Nuez'],['🦦','Río'],['🦥','Chamo'],['🦩','Rosi'],['🦘','Salto'],['🐊','Lalo'],['🦈','Tibu'],['🦭','Foqui'],['🐺','Lobito'],['🦇','Noctis'],['👦','Mateo'],['👧','Camila'],['👨‍🌾','Don Julián'],['👩‍🍳','Doña Rosa'],['👨‍🔧','Don Beto']];
const DIAS=['Lun','Mar','Mié','Jue','Vie'];
const RONDAS=Array.from({length:50},(_,i)=>{const p=i<10?['tabla','pict','tabla','pict','registrar']:i<25?['pict','barras','registrar','tabla']:['barras','registrar','pict','barras','registrar','tabla'];return p[i%p.length]});
const N=()=>k<25?3:4;
let k=0,hojas=0,aciertos=0,err=0,bloq=true,sol=null,solTxt='',h=[],ac=null,sinEnviar=0,paused=false,pend=false,jugando=false;

function tono(f,d){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.type='triangle';o.frequency.value=f;g.gain.value=.07;o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+d)}catch(e){}}
const r=n=>Math.floor(Math.random()*n);
const mez=a=>a.slice().sort(()=>Math.random()-.5);
const msg=(t,ok)=>{$('msg').textContent=t;$('msg').className='msg'+(ok?' ok':'')};
const dlg=t=>$('dlg').innerHTML=t;
const ov=t=>{$('ov').style.display=t?'flex':'none';$('ov').innerHTML=t||''};

function datos(n){let d;do{d=mez(MAT).slice(0,n).map(x=>({e:x[0],n:x[1],v:1+r(9)}))}while(new Set(d.map(x=>x.v)).size<n);return d}
function ops(c){const s=new Set([c]);while(s.size<3){const v=c+r(5)-2;if(v>=0)s.add(v)}return mez([...s])}

function opciones(lista,correcta,txt){
  sol=correcta;solTxt=txt;
  const rs=$('resp');rs.innerHTML='';
  lista.forEach(o=>{const b=document.createElement('button');b.innerHTML=o.t;b.onclick=()=>juzga(o.v===correcta);rs.appendChild(b)});
}
const opNum=c=>ops(c).map(v=>({v,t:v}));
const opMat=(d,c)=>mez(d).map(x=>({v:x.n,t:x.e+' '+x.n}));

function grafico(d){return '<div class="gr">'+d.map(x=>'<div class="col"><div class="bar" style="height:'+x.v*12+'px">'+x.v+'</div></div>').join('')+'</div><div style="display:flex">'+d.map(x=>'<div class="lab" style="flex:1">'+x.l+'</div>').join('')+'</div>'}

const TIPOS={
  tabla(){
    const d=datos(N()),q=d[r(d.length)];
    dlg('Anoté con rayitas lo que recicló la aldea.<br>¿Cuántas <b>'+q.n+'</b> '+q.e+' hay?');
    $('panel').innerHTML='<table>'+d.map(x=>'<tr><td>'+x.e+' '+x.n+'</td><td class="tl">'+'<s>||||</s> '.repeat(x.v/5|0)+'|'.repeat(x.v%5)+'</td></tr>').join('')+'</table><p class="ley">Cada grupo tachado vale 5</p>';
    opciones(opNum(q.v),q.v,q.v);
  },
  pict(){
    const d=datos(N()),t=r(3),q=d[r(d.length)];
    const mas=d.reduce((a,b)=>a.v>b.v?a:b),men=d.reduce((a,b)=>a.v<b.v?a:b);
    $('panel').innerHTML='<table>'+d.map(x=>'<tr><td>'+x.n+'</td><td class="pc">'+x.e.repeat(x.v)+'</td></tr>').join('')+'</table><p class="ley">Cada dibujo = 1</p>';
    if(t===0){dlg('Este pictograma muestra lo reciclado.<br>¿Cuántas <b>'+q.n+'</b> '+q.e+' hay?');opciones(opNum(q.v),q.v,q.v)}
    else{const s=t===1?mas:men;dlg(t===1?'¿Qué reciclamos <b>más</b>?':'¿Qué reciclamos <b>menos</b>?');opciones(opMat(d),s.n,s.n)}
  },
  barras(){
    const d=datos(N()),t=r(3);
    $('panel').innerHTML=grafico(d.map(x=>({l:x.e+'<br>'+x.n,v:x.v})));
    const mas=d.reduce((a,b)=>a.v>b.v?a:b),men=d.reduce((a,b)=>a.v<b.v?a:b);
    if(t<2){const s=t===0?mas:men;dlg('Mira el gráfico de barras.<br>¿Qué reciclamos <b>'+(t===0?'más':'menos')+'</b>?');opciones(opMat(d),s.n,s.n)}
    else{const [hi,lo]=d[0].v>d[1].v?[d[0],d[1]]:[d[1],d[0]];dlg('¿Cuántas <b>'+hi.n+'</b> '+hi.e+' hay de más que '+lo.n+' '+lo.e+'?');opciones(opNum(hi.v-lo.v),hi.v-lo.v,hi.v-lo.v)}
  },
  registrar(){
    sol=DIAS.map(()=>1+r(8));h=DIAS.map(()=>0);
    dlg('Sami ahorra Lumis cada día. <b>Registra su progreso</b>: toca el gráfico hasta la altura de cada día.');
    $('panel').innerHTML='<table class="mini"><tr>'+DIAS.map((d,i)=>'<td>'+d+'<br><b>'+sol[i]+'</b> 🪙</td>').join('')+'</tr></table><div class="gr reg" id="rg"></div>';
    pintar();
    $('resp').innerHTML='<button id="rev">Revisar</button><button class="b2" id="bor">Borrar</button>';
    $('bor').onclick=()=>{if(bloq)return;h=h.map(()=>0);pintar();msg('')};
    $('rev').onclick=revisar;
  }
};

function pintar(mal){
  $('rg').innerHTML=DIAS.map((d,i)=>{
    let c='';for(let f=8;f>=1;f--)c+='<button class="cell'+(h[i]>=f?' on':'')+'" data-i="'+i+'" data-f="'+f+'"></button>';
    return '<div class="col'+(mal&&mal.includes(i)?' mal':'')+'" style="justify-content:flex-start">'+c+'<div class="dia">'+d+'</div></div>';
  }).join('');
  $('rg').querySelectorAll('.cell').forEach(b=>b.onclick=()=>{
    if(bloq)return;const i=+b.dataset.i,f=+b.dataset.f;
    h[i]=h[i]===f?f-1:f;tono(400+f*40,.07);pintar();
  });
}
function revisar(){
  if(bloq)return;
  const mal=h.map((v,i)=>v!==sol[i]?i:-1).filter(i=>i>=0);
  if(!mal.length){const t=sol.reduce((a,b)=>a+b,0);exito('¡Registro completo! Sami ahorró '+t+' Lumis en la semana 🪙');return}
  err++;tono(180,.25);pintar(mal);
  if(err===1)msg('😕 Casi. Revisa el día '+DIAS[mal[0]]+' (las columnas naranjas).');
  else if(err===2)msg('💡 El '+DIAS[mal[0]]+' debe llegar hasta '+sol[mal[0]]+'.');
  else{h=sol.slice();pintar();fallo('Así queda el registro correcto.')}
}

function fx(){const s=$('shop');for(let n=0;n<10;n++){const e=document.createElement('span');e.className='fx';e.textContent='🍃';e.style.left=(8+Math.random()*80)+'%';e.style.animationDelay=(n*60)+'ms';s.appendChild(e);setTimeout(()=>e.remove(),1900)}}

function juzga(ok){
  if(bloq)return;
  if(ok){exito('¡Correcto! +5 Hojas 🍃');return}
  err++;tono(180,.25);
  if(err===1)msg('😕 Mira otra vez con calma.');
  else fallo('La respuesta era: '+solTxt);
}
function exito(t){
  bloq=true;aciertos++;hojas+=5;$('hj').textContent=hojas;
  sinEnviar+=5;
  fx();tono(880,.12);setTimeout(()=>tono(1175,.18),130);
  msg(t,true);setTimeout(siguiente,2400);
}
function fallo(t){bloq=true;msg(t);setTimeout(siguiente,3200)}

function ronda(){
  const c=CLI[k%CLI.length];err=0;bloq=false;
  $('rd').textContent='Ronda '+(k+1)+'/'+RONDAS.length;
  $('cara').textContent=c[0];$('nom').textContent=c[1];
  $('resp').innerHTML='';msg('');
  TIPOS[RONDAS[k]]();
}
function enviar(){
  if(!sinEnviar)return 0;
  const n=sinEnviar;
  try{
    localStorage.setItem('ranking_exploradores_hojas',(parseInt(localStorage.getItem('ranking_exploradores_hojas'))||0)+n);
    localStorage.setItem('hojas_actuales',(parseInt(localStorage.getItem('hojas_actuales'))||0)+n);
  }catch(e){return 0}
  sinEnviar=0;return n;
}
function guardarProg(){
  const kk=bloq?k+1:k;
  try{
    if(kk>=RONDAS.length)localStorage.removeItem('reciclaje_progreso');
    else localStorage.setItem('reciclaje_progreso',JSON.stringify({k:kk,hojas,aciertos}));
  }catch(e){}
}
function salir(){if(!jugando)return;enviar();guardarProg()}
window.addEventListener('pagehide',salir);
document.addEventListener('visibilitychange',()=>{if(document.hidden)salir()});

function pausar(){
  if(!jugando)return;
  if(!paused){
    paused=true;const n=enviar();guardarProg();
    $('pz').textContent='▶ Continuar';
    ov('<div class="big">⏸</div><h2>Juego en pausa</h2><p>Llevas <b>'+hojas+' Hojas de la Sabiduría</b> 🍃<br>'+(n?'✅ Enviaste '+n+' hojas al ranking':'✅ Tus hojas ya están en el ranking')+'<br>Ronda '+(k+1)+' de '+RONDAS.length+' · '+aciertos+' aciertos<br>Pulsa <b>Continuar</b> para seguir juntando hojas.</p>');
  }else{
    paused=false;$('pz').textContent='⏸ Pausar';ov('');
    if(pend){pend=false;siguiente()}
  }
}
$('pz').onclick=pausar;

function siguiente(){
  if(paused){pend=true;return}
  k++;if(k<RONDAS.length){ronda();return}
  jugando=false;$('pz').hidden=true;const n=enviar();
  try{localStorage.removeItem('reciclaje_progreso')}catch(e){}
  const est=aciertos>=40?'⭐⭐⭐':(aciertos>=25?'⭐⭐':(aciertos>=1?'⭐':'💪'));
  ov('<div class="big">'+est+'</div><h2>¡Centro limpio!</h2><p>Acertaste <b>'+aciertos+' de '+RONDAS.length+'</b> rondas.<br>Ganaste <b>'+hojas+' Hojas de la Sabiduría</b> 🍃<br>✅ Hojas enviadas al ranking</p><button id="again">Jugar otra vez</button>');
  $('again').onclick=portada;tono(784,.15);
}
function portada(){
  jugando=false;paused=false;pend=false;$('pz').hidden=true;
  let p=null;try{p=JSON.parse(localStorage.getItem('reciclaje_progreso'))}catch(e){}
  const hay=p&&p.k>0&&p.k<RONDAS.length;
  ov('<div class="big">♻️</div><h2>Reciclaje de Guardalia</h2><p>Lee tablas, pictogramas y gráficos de barras,<br>y registra el ahorro de Sami día a día.<br>Son <b>'+RONDAS.length+' rondas</b> y cada acierto gana <b>5 Hojas de la Sabiduría</b> 🍃</p>'+(hay?'<button id="cont">▶ Continuar (ronda '+(p.k+1)+')</button><button class="sec" id="go">Empezar de nuevo</button>':'<button id="go">¡Empezar a reciclar!</button>'));
  const iniciar=q=>{k=q?q.k:0;hojas=q?q.hojas:0;aciertos=q?q.aciertos:0;sinEnviar=0;$('hj').textContent=hojas;jugando=true;$('pz').hidden=false;$('pz').textContent='⏸ Pausar';ov('');tono(660,.15);ronda()};
  $('go').onclick=()=>{try{localStorage.removeItem('reciclaje_progreso')}catch(e){}iniciar(null)};
  if(hay)$('cont').onclick=()=>iniciar(p);
}
portada();
</script>
</body>
</html>
