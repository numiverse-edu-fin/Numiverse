<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bicicletas 2 Numiverse</title>
<style>
body{font-family:'Segoe UI',sans-serif;background:transparent;text-align:center;padding:10px;margin:0;user-select:none}
.game-box{max-width:460px;margin:0 auto;background:linear-gradient(135deg,#fffdf2,#f3faf6);padding:20px;border-radius:20px;border:2px solid #207168;box-shadow:0 4px 15px rgba(32,113,104,.08);position:relative;overflow:hidden;min-height:440px;display:flex;flex-direction:column;justify-content:space-between}
.ins{display:flex;align-items:center;gap:8px;background:#207168;color:#fff;padding:10px;border-radius:10px;margin-bottom:10px}
.ins p{font-size:15px;font-weight:bold;text-align:left;flex:1;margin:0}
.aud{background:#d4af37;border:0;border-radius:50%;width:34px;height:34px;font-size:16px;cursor:pointer;flex-shrink:0;color:#fff;box-shadow:0 2px 4px rgba(0,0,0,.15)}
.dots{display:flex;justify-content:center;align-items:center;gap:8px;margin-bottom:8px;font-size:12px;font-weight:bold;color:#207168}
.dots i{width:12px;height:12px;border-radius:50%;background:#dfeee7;border:2px solid #207168;display:inline-block}
.dots i.now{background:#d4af37;border-color:#b8860b}.dots i.done{background:#207168}
.et{font-size:11px;font-weight:bold;color:#207168;margin:6px 0 4px}
.zona{background:#fff;border:3px dashed #d4af37;border-radius:14px;padding:10px;transition:background .15s}
.zona.over{background:#eaf6ef;border-color:#207168}
.frame{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.sl{height:44px;border:2px dashed #e2c89a;border-radius:10px;font-size:24px;background:#fff;padding:0;cursor:default}
.sl.fijo{background:#fff4cc;border:2px solid #d4af37}
.sl.puesto{background:#d8f3e4;border:2px solid #1c8f5a;cursor:pointer;animation:brota .3s ease-out}
@keyframes brota{0%{transform:scale(.6)}100%{transform:scale(1)}}
.pile{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;background:#fff;border:2px dashed #207168;border-radius:12px;padding:10px;min-height:58px;align-items:center}
.pb{border:1px solid #d4af37;background:#fffcf2;border-radius:10px;font-size:24px;width:44px;height:40px;cursor:grab;touch-action:none;padding:0}
.opt{min-width:62px;min-height:52px;font-size:24px;font-weight:800;color:#207168;background:#fff;border:3px solid #207168;border-radius:14px;cursor:pointer;font-family:inherit;margin:0 4px}
.opt.ok{background:#d8f3e4;border-color:#1c8f5a}.opt.no{animation:shake .4s}.opt.ayuda{animation:pulso .9s infinite;border-color:#b8860b;box-shadow:0 0 10px #f2c94c}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes pulso{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
.res{font-size:13px;font-weight:bold;color:#207168;min-height:18px;margin-top:6px}
.ghost{position:fixed;z-index:1000;font-size:42px;pointer-events:none;transform:translate(-50%,-60%);filter:drop-shadow(0 4px 6px rgba(0,0,0,.25));display:none}
.controls{display:flex;gap:10px;margin-top:8px}
.btn{padding:12px 20px;font-size:14px;font-weight:bold;border:0;border-radius:10px;cursor:pointer;text-transform:uppercase;flex:1}
.btn-v{background:#d4af37;color:#fff}.btn-c{background:#b3c2bf;color:#207168}
.fb{font-size:15px;font-weight:bold;margin-top:8px;color:#b9650a;min-height:44px;line-height:1.35}
.vic{display:none;position:absolute;top:0;left:0;width:100%;height:100%;background:#fffdf2;align-items:center;justify-content:center;flex-direction:column;animation:cel .5s ease-out forwards;z-index:10}
.vt{font-size:32px;color:#27ae60;font-weight:900;margin:10px}.va{font-size:36px;color:#e6b800;font-weight:900;text-shadow:1px 1px 0 #fff}.vn{font-size:15px;color:#207168;font-weight:bold;margin-top:8px;padding:0 16px}
@keyframes cel{0%{transform:scale(.5);opacity:0}100%{transform:scale(1);opacity:1}}
</style>
</head>
<body>
<div class="game-box">
<div class="vic" id="vic"><div class="vt">¡LO LOGRASTE! 🎉</div><div class="va">+15 LUMIS</div><div class="vn">¡Ya sabes cómo se completa el diez!</div></div>
<div>
<div class="ins"><button class="aud" onclick="speakText()">🔊</button><p id="question-text"></p></div>
<div class="dots" id="dots"></div>
<div class="et">LA BICI DE SAMI (10 ESPACIOS)</div>
<div class="zona" id="zona"><div class="frame" id="frame"></div></div>
<div class="et" id="etp">PIEZAS</div>
<div class="pile" id="pile"></div>
<div class="res" id="res"></div>
</div>
<div>
<div class="fb" id="msg"></div>
<div class="controls" id="ctl"><button class="btn btn-c" onclick="borrar()">Borrar</button><button class="btn btn-v" onclick="listo()">Listo</button></div>
</div>
</div>
<script>
// MENSAJES FIJOS (para grabarlos con una voz real) y direcciones de audio: pega cada enlace en MP3.
const RONDAS=[{k:6},{k:3},{k:8}];
const TEXTOS={lleno:"¡La bici está completa! Toca Listo.",faltan:"Todavía hay espacios vacíos. Mira la bici con calma y sigue completándola.",f1:"Hagamos una prueba. Cuenta los espacios vacíos con tu dedo y busca esa cantidad de piezas. Cuenta con calma.",f3:"Te ayudo a completarla. Mira cómo se llenan los espacios. ¡Cuéntalos conmigo!",cuantas:"¡Bici completa! Ahora dime: ¿cuántas piezas pusiste tú?",q1:"Mmm, casi... Cuenta las piezas verdes. Esas son las que pusiste tú.",q2:"Hagamos una prueba. Cuenta solo las piezas verdes, una por una. Piénsalo y vuelve a intentar.",q3:"Te ayudo. Mira el número que brilla. Esas son las piezas que pusiste. ¡Tócalo!",bien:"¡Muy bien! Ya sabes cómo se completa el diez.",exito:"¡Lo lograste! Ganaste quince Lumis."};
const MP3={lleno:"",faltan:"",f1:"",f3:"",cuantas:"",q1:"",q2:"",q3:"",bien:"",exito:""};
const W=['cero','uno','dos','tres','cuatro','cinco','seis','siete','ocho','nueve','diez'];
const $=id=>document.getElementById(id);
let ronda=0,tries=0,tries2=0,bloq=false,fin=false,voz=null,audio=null,m=0,fase=1;

function elegirVoz(){if(!('speechSynthesis' in window))return;const vs=speechSynthesis.getVoices().filter(v=>v.lang.toLowerCase().indexOf('es')===0);if(!vs.length)return;
const pt=v=>{const n=v.name.toLowerCase(),l=v.lang.toLowerCase();let s=0;if(/natural|online/.test(n))s+=6;if(/google/.test(n))s+=4;
if(/paulina|monica|mónica|sabina|dalia|elvira|helena|lucia|lucía|paloma|luciana|camila|salome|salomé|valentina|sofia|sofía|marisol/.test(n))s+=3;
if(/es-pe|es-mx|es-us|es-419|es-co|es-ar/.test(l))s+=2;if(/jorge|diego|pablo|raul|raúl/.test(n))s-=1;return s};
voz=vs.sort((x,y)=>pt(y)-pt(x))[0]}
if('speechSynthesis' in window){elegirVoz();speechSynthesis.onvoiceschanged=elegirVoz}
function hablar(k){if(audio){audio.pause();audio=null}if(MP3[k]){audio=new Audio(MP3[k]);audio.play().catch(()=>leer(TEXTOS[k]));return}leer(TEXTOS[k])}
function leer(t){if(!('speechSynthesis' in window))return;speechSynthesis.cancel();
t.replace(/[^\u0020-\u007E\u00A1-\u00FF]/g,' ').replace(/([.!?])\s+/g,'$1|').split('|').forEach(f=>{if(!f.trim())return;const u=new SpeechSynthesisUtterance(f.trim());
u.lang=voz?voz.lang:'es-MX';if(voz)u.voice=voz;u.rate=.88;u.pitch=f.indexOf('¡')>=0?1.25:(f.indexOf('¿')>=0?1.18:1.08);speechSynthesis.speak(u)})}
function msg(k){$('msg').innerText=TEXTOS[k];hablar(k)}
function QTXT(){const k=RONDAS[ronda].k;return fase===1?'La bici de Sami necesita diez piezas. Ya tiene '+W[k]+'. Llena los espacios que faltan.':TEXTOS.cuantas}
function speakText(){leer(QTXT())}
function dots(){let h='';for(let i=0;i<RONDAS.length;i++)h+='<i class="'+(i<ronda?'done':(i===ronda?'now':''))+'"></i>';$('dots').innerHTML=h+'<span>Ronda '+Math.min(ronda+1,RONDAS.length)+' de '+RONDAS.length+'</span>'}
function mezclar(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

function iniciar(){const k=RONDAS[ronda].k;tries=0;tries2=0;bloq=false;fase=1;m=0;$('msg').innerText='';$('res').innerText='';$('ctl').style.display='flex';$('etp').innerText='PIEZAS';dots();
$('question-text').innerText='La bici de Sami necesita 10 piezas. Ya tiene '+k+'. Llena los espacios que faltan.';render();setTimeout(speakText,500)}
function render(){const k=RONDAS[ronda].k,f=$('frame');f.innerHTML='';
for(let i=0;i<10;i++){const s=document.createElement('button');const puesto=i>=k&&i<k+m;s.className='sl'+(i<k?' fijo':(puesto?' puesto':''));s.textContent=i<k+m?'⚙️':'';
if(puesto){s.onclick=()=>{if(bloq||fin||fase!==1)return;m--;render()}}f.appendChild(s)}
if(fase===1){const p=$('pile');p.innerHTML='';for(let i=0;i<10-m;i++){const x=document.createElement('button');x.className='pb';x.textContent='⚙️';conectar(x);p.appendChild(x)}}}
function add(){if(bloq||fin||fase!==1)return;const k=RONDAS[ronda].k;if(k+m>=10){msg('lleno');return}m++;render();if(k+m>=10)msg('lleno')}
function borrar(){if(bloq||fin||fase!==1)return;m=0;$('msg').innerText='';render()}

function conectar(btn){btn.addEventListener('pointerdown',e=>{if(bloq||fin)return;e.preventDefault();const sx=e.clientX,sy=e.clientY;let mv=false;
const g=document.createElement('div');g.className='ghost';g.textContent='⚙️';document.body.appendChild(g);
const sobre=ev=>{const el=document.elementFromPoint(ev.clientX,ev.clientY);return el&&el.closest('#zona')};
const mover=ev=>{if(!mv&&Math.hypot(ev.clientX-sx,ev.clientY-sy)>8){mv=true;g.style.display='block'}
if(mv){g.style.left=ev.clientX+'px';g.style.top=ev.clientY+'px';$('zona').classList.toggle('over',!!sobre(ev))}};
const up=ev=>{window.removeEventListener('pointermove',mover);window.removeEventListener('pointerup',up);window.removeEventListener('pointercancel',up);g.remove();$('zona').classList.remove('over');
if(ev.type==='pointercancel')return;if(!mv||sobre(ev))add()};
window.addEventListener('pointermove',mover);window.addEventListener('pointerup',up);window.addEventListener('pointercancel',up)})}

function listo(){if(bloq||fin||fase!==1)return;const k=RONDAS[ronda].k;
if(k+m>=10){fase2();return}
tries++;
if(tries===1){msg('faltan');return}
if(tries===2){msg('f1');return}
bloq=true;m=10-k;render();msg('f3');setTimeout(fase2,4200)}

function fase2(){const k=RONDAS[ronda].k,need=10-k;fase=2;bloq=false;tries2=0;$('ctl').style.display='none';$('etp').innerText='¿CUÁNTAS PIEZAS PUSISTE?';
$('question-text').innerText='¡Bici completa! ¿Cuántas piezas pusiste tú?';
const p=$('pile');p.innerHTML='';mezclar([need,need-1,need+1].filter(n=>n>=1&&n<=10)).forEach(n=>{const b=document.createElement('button');b.className='opt';b.dataset.n=n;b.textContent=n;b.onclick=()=>elegir(n,b);p.appendChild(b)});
msg('cuantas')}
function elegir(n,b){if(bloq||fin)return;const k=RONDAS[ronda].k,need=10-k;
if(n===need){bloq=true;b.classList.add('ok');$('res').innerText='Había '+k+' y pusiste '+need+': ¡forman 10!';msg('bien');pasar(3400);return}
tries2++;b.classList.add('no');setTimeout(()=>b.classList.remove('no'),600);
if(tries2===1)msg('q1');else if(tries2===2)msg('q2');else{document.querySelectorAll('.opt').forEach(x=>{if(+x.dataset.n===need)x.classList.add('ayuda')});msg('q3')}}
function pasar(ms){setTimeout(()=>{ronda++;if(ronda>=RONDAS.length)ganar();else iniciar()},ms)}
function ganar(){fin=true;dots();$('vic').style.display='flex';hablar('exito');try{if(!localStorage.getItem(CLAVE)){localStorage.setItem(CLAVE,'1');let w=parseInt(localStorage.getItem('savedLumis'))||0;localStorage.setItem('savedLumis',w+15)}}catch(e){}}
const CLAVE='ganado_bicicletas2';
let yaHecho=false;
try{yaHecho=!!localStorage.getItem(CLAVE)}catch(e){}
if(yaHecho){fin=true;ronda=RONDAS.length;dots();$('vic').style.display='flex'}else{iniciar()}
</script>
</body>
</html>
