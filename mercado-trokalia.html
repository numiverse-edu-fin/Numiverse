<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mercado de Trokalia</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:transparent;font-family:'Segoe UI',system-ui,sans-serif;user-select:none}
body{padding:8px}
.app{max-width:600px;margin:0 auto;background:#fffdf2;border:3px solid #207168;border-radius:22px;overflow:hidden;box-shadow:0 8px 24px rgba(32,113,104,.18);min-height:470px;display:flex;flex-direction:column}
header{background:#207168;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:10px 14px}
.ti{display:flex;align-items:center;gap:8px;font-weight:800;font-size:15px}
.ti svg{width:24px;height:24px}
.pill{background:#fff;color:#207168;border-radius:999px;padding:4px 14px 4px 10px;display:flex;align-items:center;gap:6px;font-weight:900;font-size:14px}
.pill svg{width:20px;height:20px}
.barra{height:8px;background:#dfeee7}
.barra i{display:block;height:100%;width:0;background:#d4af37;transition:width .4s}
main{flex:1;padding:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.grande{width:84px;height:84px;margin-bottom:6px}
h1{margin:6px 0;color:#207168;font-size:28px}
p.d{margin:8px 0 14px;color:#3d4f4b;font-weight:700;font-size:15px;line-height:1.5;max-width:440px}
.btn{border:0;border-radius:16px;background:#207168;color:#fff;font-size:17px;font-weight:800;font-family:inherit;padding:14px 34px;cursor:pointer;box-shadow:0 5px 0 #16524a}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #16524a}
.btn.sec{background:#fff;color:#207168;border:2px solid #207168;box-shadow:0 4px 0 #cfe0db;font-size:14px;padding:10px 20px}
.ronda{width:100%;max-width:520px}
.meta{display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:800;color:#207168;margin-bottom:8px}
.preg{display:flex;align-items:center;gap:8px;background:#207168;color:#fff;border-radius:12px;padding:10px 12px;text-align:left;font-weight:800;font-size:15px;line-height:1.35}
.preg span{flex:1}
.aud{flex:0 0 34px;height:34px;border:0;border-radius:50%;background:#d4af37;color:#fff;font-size:16px;cursor:pointer}
.items{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:12px 0}
.chip{background:#fff;border:2px solid #d4af37;border-radius:12px;padding:6px 12px;font-weight:800;color:#207168;font-size:14px;display:flex;align-items:center;gap:6px}
.chip b{font-size:22px}
.ofertas{display:flex;gap:10px;margin:12px 0}
.of{flex:1;background:#fff;border:3px solid #207168;border-radius:14px;padding:10px 6px;cursor:pointer;font-family:inherit;color:#207168}
.of .l{font-weight:900;font-size:13px}
.of .em{font-size:20px;line-height:1.25;min-height:50px;word-break:break-all}
.of .pr{font-weight:900;font-size:16px}
.ops{display:flex;gap:10px;justify-content:center;margin:12px 0}
.op{min-width:84px;padding:12px 10px;font-size:22px;font-weight:900;color:#207168;background:#fff;border:3px solid #207168;border-radius:14px;cursor:pointer;font-family:inherit}
.ok{background:#d8f3e4!important;border-color:#1c8f5a!important}
.no{animation:shake .4s}
.ayuda{animation:pulso .9s infinite;border-color:#b8860b!important;box-shadow:0 0 12px #f2c94c}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes pulso{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
.fb{min-height:50px;font-size:14px;font-weight:800;color:#b9650a;line-height:1.4;margin:4px 0 8px}
.fb.bien{color:#1c8f5a}
.res{display:flex;gap:10px;justify-content:center;margin:10px 0 14px}
.caja{background:#fff;border:2px solid #207168;border-radius:14px;padding:10px 16px;color:#207168;font-weight:900}
.caja b{display:block;font-size:26px}
.caja small{font-size:11px;font-weight:800;color:#5c716d}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="ti" id="ti"></div>
    <div class="pill" id="pill"></div>
  </header>
  <div class="barra" id="bw" hidden><i id="bi"></i></div>
  <main id="main"></main>
</div>
<script>
/* ===== DATOS (cada ronda tiene un id fijo; las hojas se pagan una sola vez por ronda) ===== */
var HOJAS=5;                                  /* hojas por acierto */
var CLAVE_HECHAS='mj_trokalia_hechas';        /* rondas que ya pagaron hojas */
var RONDAS=[
 {id:'r01',t:'total',items:[['🥖','Pan',4],['🧃','Jugo',3]],o:[6,7,9]},
 {id:'r02',t:'total',items:[['📓','Cuaderno',12],['✏️','Lápiz',5],['🧽','Goma',3]],o:[18,20,23]},
 {id:'r03',t:'cambio',pago:20,items:[['🍎','Manzanas',13]],o:[6,7,33]},
 {id:'r04',t:'cambio',pago:50,items:[['🥛','Leche',21],['🧀','Queso',15]],o:[14,16,86]},
 {id:'r05',t:'mejor',A:{n:3,p:12,e:'🥭',nom:'mangos'},B:{n:5,p:15,e:'🥭',nom:'mangos'}},
 {id:'r06',t:'mejor',A:{n:2,p:10,e:'🧃',nom:'jugos'},B:{n:3,p:12,e:'🧃',nom:'jugos'}},
 {id:'r07',t:'desc',nom:'Mochila',e:'🎒',precio:40,tipo:'mitad',o:[10,20,40]},
 {id:'r08',t:'desc',nom:'Zapatos',e:'👟',precio:80,tipo:'pct',pct:10,o:[8,70,72]},
 {id:'r09',t:'falta',tengo:45,items:[['🧢','Gorra',18],['🧤','Guantes',15],['🧣','Bufanda',14]],o:[2,3,47]},
 {id:'r10',t:'total',items:[['🎨','Pinturas',25],['📐','Reglas',18],['📎','Clips',9]],o:[42,52,53]},
 {id:'r11',t:'mejor',A:{n:6,p:24,e:'🍪',nom:'galletas'},B:{n:4,p:20,e:'🍪',nom:'galletas'}},
 {id:'r12',t:'desc',nom:'Bicicleta',e:'🚲',precio:200,tipo:'pct',pct:25,o:[50,150,175]}
];
function suma(r){return r.items.reduce(function(s,i){return s+i[2]},0)}
function descuento(r){return r.tipo==='mitad'?r.precio/2:r.precio*r.pct/100}
function resp(r){
  if(r.t==='total')return suma(r);
  if(r.t==='cambio')return r.pago-suma(r);
  if(r.t==='falta')return suma(r)-r.tengo;
  if(r.t==='desc')return r.precio-descuento(r);
  if(r.t==='mejor')return (r.A.p/r.A.n<r.B.p/r.B.n)?'A':'B';
}
function pregunta(r){
  if(r.t==='total')return 'Estás en el mercado de Trokalia y compras esto. ¿Cuántos Lumis cuesta todo junto?';
  if(r.t==='cambio')return 'Pagas con '+r.pago+' Lumis. ¿Cuánto te devuelven de vuelto?';
  if(r.t==='falta')return 'Tienes '+r.tengo+' Lumis y quieres comprar todo esto. ¿Cuántos Lumis te faltan?';
  if(r.t==='desc')return 'La '+(r.nom==='Mochila'?'mochila':r.nom.toLowerCase())+' cuesta '+r.precio+' Lumis y tiene '+(r.tipo==='mitad'?'la mitad de precio':r.pct+'% de descuento')+'. ¿Cuántos Lumis pagas?';
  if(r.t==='mejor')return '¿Qué oferta sale más barata por cada '+r.A.nom.replace(/s$/,'')+'?';
}
function pista(r,n){
  var t=r.t;
  if(n===1){
    if(t==='total')return 'Suma los precios uno por uno, con calma.';
    if(t==='cambio')return 'El vuelto es lo que sobra: lo que pagas menos lo que cuesta.';
    if(t==='falta')return 'Primero suma todo lo que quieres comprar.';
    if(t==='desc')return r.tipo==='mitad'?'La mitad es dividir entre 2.':(r.pct===10?'El 10% es la décima parte: divide entre 10.':'El 25% es la cuarta parte: divide entre 4.');
    if(t==='mejor')return 'Fíjate cuánto cuesta cada uno, no solo el total.';
  }
  if(t==='total')return 'Prueba así: suma los dos primeros y luego agrega el siguiente.';
  if(t==='cambio')return 'Cuenta desde lo que cuesta hasta llegar a lo que pagaste.';
  if(t==='falta')return 'Compara el total con lo que tienes: la diferencia es lo que falta.';
  if(t==='desc')return 'Primero calcula cuánto te descuentan y luego réstalo del precio.';
  return 'Divide el precio entre la cantidad en cada oferta y compara.';
}
function explica(r){
  var t=r.t;
  if(t==='total')return r.items.map(function(i){return i[2]}).join(' + ')+' = '+suma(r);
  if(t==='cambio')return r.pago+' − '+suma(r)+' = '+resp(r);
  if(t==='falta')return r.items.map(function(i){return i[2]}).join(' + ')+' = '+suma(r)+'. Luego '+suma(r)+' − '+r.tengo+' = '+resp(r);
  if(t==='desc'){
    if(r.tipo==='mitad')return r.precio+' ÷ 2 = '+resp(r);
    return 'El '+r.pct+'% de '+r.precio+' es '+descuento(r)+'. Entonces '+r.precio+' − '+descuento(r)+' = '+resp(r);
  }
  var a=r.A.p/r.A.n,b=r.B.p/r.B.n;
  return r.A.p+' ÷ '+r.A.n+' = '+a+' y '+r.B.p+' ÷ '+r.B.n+' = '+b+'. Conviene la oferta '+resp(r);
}
/*FIN_DATOS*/

var $=function(id){return document.getElementById(id)};
function leer_(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lista(k){try{return JSON.parse(leer_(k))||[]}catch(e){return []}}
function modoPrueba(){return leer_('modo_prueba')==='1'}
function hojasTotal(){return parseInt(leer_('hojas_actuales'))||0}

var HOJA='<svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="18.5" fill="#1f6d2a" stroke="#e8c25a" stroke-width="2.2"/><path d="M20 7C31 13 31 26 20 33C9 26 9 13 20 7Z" fill="#dff2c4"/><path d="M20 11V31M20 17L15 14M20 22L14.5 19M20 17L25 14M20 22L25.5 19" stroke="#3f8f3a" stroke-width="1.6" stroke-linecap="round" fill="none"/></svg>';
var LLAMA='<svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="18.5" fill="#8c2018" stroke="#e8c25a" stroke-width="2.2"/><circle cx="20" cy="20" r="15.3" fill="none" stroke="rgba(255,255,255,.35)" stroke-width=".8"/><path d="M20 6C22 12 29 15 28 24C27 30 23 33 20 33C16 33 12 30 12 24C12 19 15 17 16 13C18 15 18 17 19 17C21 13 20 10 20 6Z" fill="#ffab2e"/><path d="M20 18C22 22 25 23 24 28C23 31 21 32 20 32C18 32 16 31 16 28C16 25 19 24 20 18Z" fill="#ffe28a"/></svg>';

/* ===== voz ===== */
var voz=null;
function elegirVoz(){if(!('speechSynthesis' in window))return;var vs=speechSynthesis.getVoices().filter(function(v){return v.lang.toLowerCase().indexOf('es')===0});if(!vs.length)return;
  var pt=function(v){var n=v.name.toLowerCase(),l=v.lang.toLowerCase(),s=0;if(/natural|online/.test(n))s+=6;if(/google/.test(n))s+=4;if(/es-pe|es-mx|es-us|es-419|es-co|es-ar/.test(l))s+=2;return s};
  voz=vs.sort(function(a,b){return pt(b)-pt(a)})[0]}
if('speechSynthesis' in window){elegirVoz();speechSynthesis.onvoiceschanged=elegirVoz}
function leer(t){if(!('speechSynthesis' in window))return;speechSynthesis.cancel();
  var u=new SpeechSynthesisUtterance(t.replace(/[^\u0020-\u007E\u00A1-\u00FF]/g,' '));u.lang=voz?voz.lang:'es-MX';if(voz)u.voice=voz;u.rate=.9;speechSynthesis.speak(u)}

/* ===== estado ===== */
var idx=0,errores=0,bloq=false,aciertos=0,ganadas=0,orden=[];
function pintarCab(){
  $('ti').innerHTML=LLAMA+'<span>Mercado de Trokalia</span>';
  $('pill').innerHTML=HOJA+'<span>'+hojasTotal()+'</span>';
}
function pagar(id){
  if(modoPrueba())return 'prueba';
  var hechas=lista(CLAVE_HECHAS);
  if(hechas.indexOf(id)>=0)return 'ya';
  try{
    ['ranking_exploradores_hojas','hojas_actuales'].forEach(function(k){localStorage.setItem(k,String((parseInt(localStorage.getItem(k))||0)+HOJAS))});
    hechas.push(id);localStorage.setItem(CLAVE_HECHAS,JSON.stringify(hechas));
    return 'ok';
  }catch(e){return 'error'}
}
function inicio(){
  $('bw').hidden=true;pintarCab();
  var hechas=lista(CLAVE_HECHAS).length;
  var todo=hechas>=RONDAS.length;
  $('main').innerHTML='<div class="grande">'+LLAMA+'</div><h1>Mercado de Trokalia</h1>'+
    '<p class="d">Suma compras, calcula el vuelto, compara ofertas y encuentra descuentos.<br>Son <b>'+RONDAS.length+' rondas</b> y cada acierto gana <b>'+HOJAS+' Hojas de la Sabiduría</b></p>'+
    (todo?'<p class="d">⭐ Ya completaste todas las rondas. Puedes practicar otra vez, pero ya no ganas más hojas.</p>':(hechas?'<p class="d">Ya llevas '+hechas+' de '+RONDAS.length+' rondas con hojas ganadas.</p>':''))+
    '<button class="btn" id="go">'+(todo?'¡Practicar de nuevo!':'¡Empezar a comprar!')+'</button>';
  $('go').onclick=empezar;
}
function empezar(){idx=0;aciertos=0;ganadas=0;orden=RONDAS.slice();ronda()}
function ronda(){
  var r=orden[idx];errores=0;bloq=false;pintarCab();
  $('bw').hidden=false;$('bi').style.width=(idx/orden.length*100)+'%';
  var vis='';
  if(r.t==='mejor'){
    var rep=function(o){var s='';for(var i=0;i<o.n;i++)s+=o.e;return s};
    vis='<div class="ofertas">'+
      '<button class="of" data-v="A"><div class="l">OFERTA A</div><div class="em">'+rep(r.A)+'</div><div class="pr">'+r.A.n+' por '+r.A.p+' Lumis</div></button>'+
      '<button class="of" data-v="B"><div class="l">OFERTA B</div><div class="em">'+rep(r.B)+'</div><div class="pr">'+r.B.n+' por '+r.B.p+' Lumis</div></button></div>';
  }else if(r.t==='desc'){
    vis='<div class="items"><div class="chip"><b>'+r.e+'</b>'+r.nom+' · 🪙 '+r.precio+'</div></div>';
  }else{
    vis='<div class="items">'+r.items.map(function(i){return '<div class="chip"><b>'+i[0]+'</b>'+i[1]+' · 🪙 '+i[2]+'</div>'}).join('')+'</div>';
  }
  var ops='';
  if(r.t!=='mejor'){
    ops='<div class="ops">'+mezclar(r.o.slice()).map(function(n){return '<button class="op" data-v="'+n+'">🪙 '+n+'</button>'}).join('')+'</div>';
  }
  $('main').innerHTML='<div class="ronda"><div class="meta"><span>Ronda '+(idx+1)+' de '+orden.length+'</span><span>Aciertos: '+aciertos+'</span></div>'+
    '<div class="preg"><button class="aud" id="aud" aria-label="Escuchar">🔊</button><span>'+pregunta(r)+'</span></div>'+vis+ops+'<div class="fb" id="fb"></div><div id="sig"></div></div>';
  $('aud').onclick=function(){leer(pregunta(r)+(r.t==='total'||r.t==='cambio'||r.t==='falta'?' '+r.items.map(function(i){return i[1]+' '+i[2]}).join(', '):''))};
  [].forEach.call(document.querySelectorAll('[data-v]'),function(b){b.onclick=function(){elegir(b)}});
}
function elegir(b){
  if(bloq)return;var r=orden[idx],v=b.getAttribute('data-v'),c=resp(r);
  var ok=(r.t==='mejor')?(v===c):(parseInt(v)===c);
  var fb=$('fb');
  if(ok){
    bloq=true;b.classList.add('ok');fb.className='fb bien';
    var msg='¡Correcto! '+explica(r)+'. ';
    if(errores<=1){
      aciertos++;
      var p=pagar(r.id);
      if(p==='ok'){ganadas+=HOJAS;msg+='🍃 +'+HOJAS+' hojas';}
      else if(p==='ya')msg+='(Esta ronda ya te dio sus hojas antes)';
      else if(p==='prueba')msg+='🧪 Modo prueba: no se contaron';
      else msg+='No se pudieron guardar las hojas';
    }
    fb.textContent=msg;pintarCab();siguiente();return;
  }
  errores++;b.classList.add('no');setTimeout(function(){b.classList.remove('no')},500);fb.className='fb';
  if(errores===1){fb.textContent='Casi... '+pista(r,1);return}
  bloq=true;
  [].forEach.call(document.querySelectorAll('[data-v]'),function(x){var xv=x.getAttribute('data-v');if((r.t==='mejor')?(xv===c):(parseInt(xv)===c))x.classList.add('ayuda')});
  fb.textContent='Mira cómo se resuelve: '+explica(r)+'. Esa es la respuesta que brilla.';
  siguiente();
}
function siguiente(){
  var ult=idx>=orden.length-1;
  $('sig').innerHTML='<button class="btn" id="nx">'+(ult?'Ver resultado':'Continuar')+'</button>';
  $('nx').onclick=function(){if(ult)fin();else{idx++;ronda()}};
}
function fin(){
  $('bw').hidden=false;$('bi').style.width='100%';pintarCab();
  var perfecto=aciertos===orden.length;
  $('main').innerHTML='<div class="grande">'+HOJA+'</div><h1>'+(perfecto?'¡Mercado dominado!':'¡Buen trabajo!')+'</h1>'+
    '<div class="res"><div class="caja"><b>'+aciertos+'/'+orden.length+'</b><small>aciertos</small></div><div class="caja"><b>🍃 '+ganadas+'</b><small>hojas ganadas ahora</small></div></div>'+
    '<p class="d">'+(perfecto?'Calculaste todo sin trampas del mercado.':'Puedes volver a jugar para practicar. Las rondas que ya te dieron hojas no las pagan otra vez.')+'</p>'+
    '<button class="btn" id="otra">Jugar otra vez</button>';
  $('otra').onclick=inicio;
}
function mezclar(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}
window.addEventListener('storage',pintarCab);
inicio();
</script>
</body>
</html>
